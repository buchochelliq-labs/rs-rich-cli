# high-contrast: bright colours on black, every text colour at least 7:1
# (WCAG AAA) against #000000. For a black terminal background. No dim text.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `high-contrast`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file high-contrast.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.
#
# The background it is made for (its contrast is checked against it):
# background: #000000

[styles]
# inspect
inspect.attr = italic #ffff5f
inspect.attr.dunder = italic #d0d0d0
inspect.callable = bold #ff8787
inspect.async_def = italic #5fffff
inspect.def = italic #5fffff
inspect.class = italic #5fffff
inspect.error = bold #ff8787
inspect.equals = none
inspect.help = #87d7ff
inspect.doc = #d0d0d0
inspect.value.border = #ffffff
live.ellipsis = bold #ff8787
layout.tree.row = not dim #ff8787
layout.tree.column = not dim #87d7ff
# logging
logging.keyword = bold #ffff5f
logging.level.notset = #d0d0d0
logging.level.debug = #87ff87
logging.level.info = #87d7ff
logging.level.warning = #ffff5f
logging.level.error = bold #ff8787
logging.level.critical = bold reverse #ff8787
log.level = none
log.time = #d0d0d0
log.message = none
log.path = #d0d0d0
# repr (pretty printing and the repr highlighter)
repr.ellipsis = #ffff5f
repr.indent = #d0d0d0
repr.error = bold #ff8787
repr.str = not bold not italic #87ff87
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold #87ff87
repr.ipv6 = bold #87ff87
repr.eui48 = bold #87ff87
repr.eui64 = bold #87ff87
repr.tag_start = bold
repr.tag_name = bold #ffff5f
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic #ffff5f
repr.attrib_equal = bold
repr.attrib_value = not italic #ffff5f
repr.number = bold not italic #ffd75f
repr.number_complex = bold not italic #ffd75f
repr.bool_true = italic #87ff87
repr.bool_false = italic #ff8787
repr.none = italic #ffff5f
repr.url = not bold not italic underline #87d7ff
repr.uuid = not bold #ffd75f
repr.call = bold #ffff5f
repr.path = #ffff5f
repr.filename = #5fffff
# rules
rule.line = #ffffff
rule.text = #ffffff
# json
json.brace = bold
json.bool_true = italic #87ff87
json.bool_false = italic #ff8787
json.null = italic #ffff5f
json.number = bold not italic #ffd75f
json.str = not bold not italic #87ff87
json.key = bold #87d7ff
# prompts
prompt = none
prompt.choices = bold #ffff5f
prompt.default = bold #5fffff
prompt.invalid = #ff8787
prompt.invalid.choice = #ff8787
pretty = none
# scope
scope.border = #ffffff
scope.key = italic #ffff5f
scope.key.special = italic #d0d0d0
scope.equals = #ff8787
# tables
table.header = bold #ffffff
table.footer = bold
table.cell = none
table.title = italic #ffffff
table.caption = italic #d0d0d0
# tracebacks
traceback.error = italic #ff8787
traceback.border.syntax_error = #ff8787
traceback.border = #ff8787
traceback.text = none
traceback.title = bold #ff8787
traceback.exc_type = bold #ff8787
traceback.exc_value = none
traceback.offset = bold #ff8787
traceback.error_range = bold underline
traceback.note = bold #87ff87
traceback.group.border = #ffff5f
# progress
bar.back = #767676
bar.complete = #ffff5f
bar.finished = #87ff87
bar.pulse = #ffff5f
progress.description = none
progress.filesize = #87ff87
progress.filesize.total = #87ff87
progress.download = #87ff87
progress.elapsed = #ffff5f
progress.percentage = #ffff5f
progress.remaining = #5fffff
progress.data.speed = #87d7ff
progress.spinner = #ffff5f
status.spinner = #ffff5f
# trees
tree = none
tree.line = #ffffff
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold #ffff5f on #000000
markdown.code_block = #ffffff on #000000
markdown.block_quote = italic #ffffff
markdown.list = #5fffff
markdown.item = none
markdown.item.bullet = bold #ffff5f
markdown.item.number = #5fffff
markdown.hr = #ffffff
markdown.h1.border = #ffffff
markdown.h1 = bold underline #ffffff
markdown.h2 = bold #ffffff
markdown.h3 = bold #ffff5f
markdown.h4 = italic #ffff5f
markdown.h5 = italic #5fffff
markdown.h6 = italic #d0d0d0
markdown.h7 = italic #d0d0d0
markdown.link = #87d7ff
markdown.link_url = underline #87d7ff
markdown.s = strike
markdown.table.border = #ffffff
markdown.table.header = bold #ffffff
markdown.kbd = bold #ffd75f
# dates and times
iso8601.date = #87d7ff
iso8601.time = #ffff5f
iso8601.timezone = #ffff5f
