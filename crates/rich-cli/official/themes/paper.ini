# paper: a light theme in inks on warm paper, for a light terminal
# background.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `paper`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file paper.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.
#
# The background it is made for (its contrast is checked against it):
# background: #fbf8f1

[styles]
# inspect
inspect.attr = italic #7d5400
inspect.attr.dunder = italic #6a655e
inspect.callable = bold #b3261e
inspect.async_def = italic #1d6b74
inspect.def = italic #1d6b74
inspect.class = italic #1d6b74
inspect.error = bold #b3261e
inspect.equals = none
inspect.help = #1d4fa0
inspect.doc = #6a655e
inspect.value.border = #8a8478
live.ellipsis = bold #b3261e
layout.tree.row = not dim #b3261e
layout.tree.column = not dim #1d4fa0
# logging
logging.keyword = bold #7d5400
logging.level.notset = #6a655e
logging.level.debug = #2b7230
logging.level.info = #1d4fa0
logging.level.warning = #7d5400
logging.level.error = bold #b3261e
logging.level.critical = bold reverse #b3261e
log.level = none
log.time = #6a655e
log.message = none
log.path = #6a655e
# repr (pretty printing and the repr highlighter)
repr.ellipsis = #7d5400
repr.indent = #6a655e
repr.error = bold #b3261e
repr.str = not bold not italic #2f6a1f
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold #2b7230
repr.ipv6 = bold #2b7230
repr.eui48 = bold #2b7230
repr.eui64 = bold #2b7230
repr.tag_start = bold
repr.tag_name = bold #6b3fa0
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic #7d5400
repr.attrib_equal = bold
repr.attrib_value = not italic #6b3fa0
repr.number = bold not italic #944700
repr.number_complex = bold not italic #944700
repr.bool_true = italic #2b7230
repr.bool_false = italic #b3261e
repr.none = italic #6b3fa0
repr.url = not bold not italic underline #1a56b8
repr.uuid = not bold #944700
repr.call = bold #6b3fa0
repr.path = #6b3fa0
repr.filename = #1d6b74
# rules
rule.line = #8a8478
rule.text = #4a2a7a
# json
json.brace = bold
json.bool_true = italic #2b7230
json.bool_false = italic #b3261e
json.null = italic #6b3fa0
json.number = bold not italic #944700
json.str = not bold not italic #2f6a1f
json.key = bold #1d4fa0
# prompts
prompt = none
prompt.choices = bold #6b3fa0
prompt.default = bold #1d6b74
prompt.invalid = #b3261e
prompt.invalid.choice = #b3261e
pretty = none
# scope
scope.border = #8a8478
scope.key = italic #7d5400
scope.key.special = italic #6a655e
scope.equals = #b3261e
# tables
table.header = bold #4a2a7a
table.footer = bold
table.cell = none
table.title = italic #4a2a7a
table.caption = italic #6a655e
# tracebacks
traceback.error = italic #b3261e
traceback.border.syntax_error = #b3261e
traceback.border = #b3261e
traceback.text = none
traceback.title = bold #b3261e
traceback.exc_type = bold #b3261e
traceback.exc_value = none
traceback.offset = bold #b3261e
traceback.error_range = bold underline
traceback.note = bold #2b7230
traceback.group.border = #6b3fa0
# progress
bar.back = #e2dccf
bar.complete = #6b3fa0
bar.finished = #2b7230
bar.pulse = #6b3fa0
progress.description = none
progress.filesize = #2b7230
progress.filesize.total = #2b7230
progress.download = #2b7230
progress.elapsed = #7d5400
progress.percentage = #6b3fa0
progress.remaining = #1d6b74
progress.data.speed = #1d4fa0
progress.spinner = #6b3fa0
status.spinner = #6b3fa0
# trees
tree = none
tree.line = #8a8478
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold #5a1f3a on #f0e9dc
markdown.code_block = #3b3530 on #f2ece0
markdown.block_quote = italic #55504a
markdown.list = #1d6b74
markdown.item = none
markdown.item.bullet = bold #6b3fa0
markdown.item.number = #1d6b74
markdown.hr = #8a8478
markdown.h1.border = #8a8478
markdown.h1 = bold underline #4a2a7a
markdown.h2 = bold #4a2a7a
markdown.h3 = bold #6b3fa0
markdown.h4 = italic #6b3fa0
markdown.h5 = italic #1d6b74
markdown.h6 = italic #6a655e
markdown.h7 = italic #6a655e
markdown.link = #1a56b8
markdown.link_url = underline #1a56b8
markdown.s = strike
markdown.table.border = #8a8478
markdown.table.header = bold #4a2a7a
markdown.kbd = bold #944700
# dates and times
iso8601.date = #1d4fa0
iso8601.time = #6b3fa0
iso8601.timezone = #7d5400
