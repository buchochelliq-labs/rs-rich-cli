# mono: no colour at all, only bold, italic, underline, dim, reverse and
# strike, so it reads the same on any background and in any colour mode.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `mono`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file mono.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.

[styles]
# inspect
inspect.attr = italic bold
inspect.attr.dunder = italic dim
inspect.callable = bold
inspect.async_def = italic
inspect.def = italic
inspect.class = italic
inspect.error = bold
inspect.equals = none
inspect.help = none
inspect.doc = dim
inspect.value.border = none
live.ellipsis = bold
layout.tree.row = not dim bold
layout.tree.column = not dim
# logging
logging.keyword = bold
logging.level.notset = dim
logging.level.debug = none
logging.level.info = none
logging.level.warning = bold
logging.level.error = bold
logging.level.critical = bold reverse
log.level = none
log.time = dim
log.message = none
log.path = dim
# repr (pretty printing and the repr highlighter)
repr.ellipsis = bold
repr.indent = dim
repr.error = bold
repr.str = not bold not italic
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold
repr.ipv6 = bold
repr.eui48 = bold
repr.eui64 = bold
repr.tag_start = bold
repr.tag_name = bold
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic bold
repr.attrib_equal = bold
repr.attrib_value = not italic bold
repr.number = bold not italic
repr.number_complex = bold not italic
repr.bool_true = italic
repr.bool_false = italic bold
repr.none = italic bold
repr.url = not bold not italic underline
repr.uuid = not bold
repr.call = bold
repr.path = bold
repr.filename = none
# rules
rule.line = none
rule.text = bold
# json
json.brace = bold
json.bool_true = italic
json.bool_false = italic bold
json.null = italic bold
json.number = bold not italic
json.str = not bold not italic
json.key = bold
# prompts
prompt = none
prompt.choices = bold
prompt.default = bold
prompt.invalid = bold
prompt.invalid.choice = bold
pretty = none
# scope
scope.border = none
scope.key = italic bold
scope.key.special = italic dim
scope.equals = bold
# tables
table.header = bold
table.footer = bold
table.cell = none
table.title = italic bold
table.caption = italic dim
# tracebacks
traceback.error = italic bold
traceback.border.syntax_error = bold
traceback.border = bold
traceback.text = none
traceback.title = bold
traceback.exc_type = bold
traceback.exc_value = none
traceback.offset = bold
traceback.error_range = bold underline
traceback.note = bold
traceback.group.border = bold
# progress
bar.back = dim
bar.complete = bold
bar.finished = bold
bar.pulse = bold
progress.description = none
progress.filesize = none
progress.filesize.total = none
progress.download = none
progress.elapsed = bold
progress.percentage = bold
progress.remaining = none
progress.data.speed = none
progress.spinner = bold
status.spinner = bold
# trees
tree = none
tree.line = none
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold
markdown.code_block = none
markdown.block_quote = italic
markdown.list = none
markdown.item = none
markdown.item.bullet = bold
markdown.item.number = none
markdown.hr = none
markdown.h1.border = none
markdown.h1 = bold underline
markdown.h2 = bold
markdown.h3 = bold
markdown.h4 = italic bold
markdown.h5 = italic
markdown.h6 = italic dim
markdown.h7 = italic dim
markdown.link = underline
markdown.link_url = underline
markdown.s = strike
markdown.table.border = none
markdown.table.header = bold
markdown.kbd = bold
# dates and times
iso8601.date = none
iso8601.time = bold
iso8601.timezone = bold
