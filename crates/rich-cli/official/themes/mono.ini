# mono: no colour at all, only bold, italic, underline, dim, reverse and
# strike, so it reads the same on any background and in any colour mode.
# Every style that has a colour in rich's default theme names `default` (the
# terminal's own colour), so no default colour shows through.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `mono`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file mono.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.

[styles]
# inspect
inspect.attr = italic bold default
inspect.attr.dunder = italic dim default
inspect.callable = bold default
inspect.async_def = italic default
inspect.def = italic default
inspect.class = italic default
inspect.error = bold default
inspect.equals = none
inspect.help = default
inspect.doc = dim
inspect.value.border = default
live.ellipsis = bold default
layout.tree.row = not dim bold default
layout.tree.column = not dim default
# logging
logging.keyword = bold default
logging.level.notset = dim
logging.level.debug = default
logging.level.info = default
logging.level.warning = bold default
logging.level.error = bold default
logging.level.critical = bold reverse default
log.level = none
log.time = dim default
log.message = none
log.path = dim
# repr (pretty printing and the repr highlighter)
repr.ellipsis = bold default
repr.indent = dim default
repr.error = bold default
repr.str = not bold not italic default
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold default
repr.ipv6 = bold default
repr.eui48 = bold default
repr.eui64 = bold default
repr.tag_start = bold
repr.tag_name = bold default
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic bold default
repr.attrib_equal = bold
repr.attrib_value = not italic bold default
repr.number = bold not italic default
repr.number_complex = bold not italic default
repr.bool_true = italic default
repr.bool_false = italic bold default
repr.none = italic bold default
repr.url = not bold not italic underline default
repr.uuid = not bold default
repr.call = bold default
repr.path = bold default
repr.filename = default
# rules
rule.line = default
rule.text = bold
# json
json.brace = bold
json.bool_true = italic default
json.bool_false = italic bold default
json.null = italic bold default
json.number = bold not italic default
json.str = not bold not italic default
json.key = bold default
# prompts
prompt = none
prompt.choices = bold default
prompt.default = bold default
prompt.invalid = bold default
prompt.invalid.choice = bold default
pretty = none
# scope
scope.border = default
scope.key = italic bold default
scope.key.special = italic dim default
scope.equals = bold default
# tables
table.header = bold
table.footer = bold
table.cell = none
table.title = italic bold
table.caption = italic dim
# tracebacks
traceback.error = italic bold default
traceback.border.syntax_error = bold default
traceback.border = bold default
traceback.text = none
traceback.title = bold default
traceback.exc_type = bold default
traceback.exc_value = none
traceback.offset = bold default
traceback.error_range = bold underline
traceback.note = bold default
traceback.group.border = bold default
# progress
bar.back = dim default
bar.complete = bold default
bar.finished = bold default
bar.pulse = bold default
progress.description = none
progress.filesize = default
progress.filesize.total = default
progress.download = default
progress.elapsed = bold default
progress.percentage = bold default
progress.remaining = default
progress.data.speed = default
progress.spinner = bold default
status.spinner = bold default
# trees
tree = none
tree.line = none
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold default on default
markdown.code_block = default on default
markdown.block_quote = italic default
markdown.list = default
markdown.item = none
markdown.item.bullet = bold
markdown.item.number = default
markdown.hr = none
markdown.h1.border = none
markdown.h1 = bold underline
markdown.h2 = bold default
markdown.h3 = bold default
markdown.h4 = italic bold default
markdown.h5 = italic
markdown.h6 = italic dim
markdown.h7 = italic dim
markdown.link = underline default
markdown.link_url = underline default
markdown.s = strike
markdown.table.border = default
markdown.table.header = bold default
markdown.kbd = bold default
# dates and times
iso8601.date = default
iso8601.time = bold default
iso8601.timezone = bold default
