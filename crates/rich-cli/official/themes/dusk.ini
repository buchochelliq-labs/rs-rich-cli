# dusk: a dark theme in violets and teals, for a dark terminal background.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `dusk`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file dusk.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.
#
# The background it is made for (its contrast is checked against it):
# background: #1b1a24

[styles]
# inspect
inspect.attr = italic #eccb7a
inspect.attr.dunder = italic #9a96aa
inspect.callable = bold #f58a98
inspect.async_def = italic #7fcbd8
inspect.def = italic #7fcbd8
inspect.class = italic #7fcbd8
inspect.error = bold #f58a98
inspect.equals = none
inspect.help = #8cb4f5
inspect.doc = #9a96aa
inspect.value.border = #6b6488
live.ellipsis = bold #f58a98
layout.tree.row = not dim #f58a98
layout.tree.column = not dim #8cb4f5
# logging
logging.keyword = bold #eccb7a
logging.level.notset = #9a96aa
logging.level.debug = #8fd694
logging.level.info = #8cb4f5
logging.level.warning = #eccb7a
logging.level.error = bold #f58a98
logging.level.critical = bold reverse #f58a98
log.level = none
log.time = #9a96aa
log.message = none
log.path = #9a96aa
# repr (pretty printing and the repr highlighter)
repr.ellipsis = #eccb7a
repr.indent = #9a96aa
repr.error = bold #f58a98
repr.str = not bold not italic #a3d98c
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold #8fd694
repr.ipv6 = bold #8fd694
repr.eui48 = bold #8fd694
repr.eui64 = bold #8fd694
repr.tag_start = bold
repr.tag_name = bold #c39cf2
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic #eccb7a
repr.attrib_equal = bold
repr.attrib_value = not italic #c39cf2
repr.number = bold not italic #f2b880
repr.number_complex = bold not italic #f2b880
repr.bool_true = italic #8fd694
repr.bool_false = italic #f58a98
repr.none = italic #c39cf2
repr.url = not bold not italic underline #93bfff
repr.uuid = not bold #f2b880
repr.call = bold #c39cf2
repr.path = #c39cf2
repr.filename = #7fcbd8
# rules
rule.line = #6b6488
rule.text = #d7b8ff
# json
json.brace = bold
json.bool_true = italic #8fd694
json.bool_false = italic #f58a98
json.null = italic #c39cf2
json.number = bold not italic #f2b880
json.str = not bold not italic #a3d98c
json.key = bold #8cb4f5
# prompts
prompt = none
prompt.choices = bold #c39cf2
prompt.default = bold #7fcbd8
prompt.invalid = #f58a98
prompt.invalid.choice = #f58a98
pretty = none
# scope
scope.border = #6b6488
scope.key = italic #eccb7a
scope.key.special = italic #9a96aa
scope.equals = #f58a98
# tables
table.header = bold #d7b8ff
table.footer = bold
table.cell = none
table.title = italic #d7b8ff
table.caption = italic #9a96aa
# tracebacks
traceback.error = italic #f58a98
traceback.border.syntax_error = #f58a98
traceback.border = #f58a98
traceback.text = none
traceback.title = bold #f58a98
traceback.exc_type = bold #f58a98
traceback.exc_value = none
traceback.offset = bold #f58a98
traceback.error_range = bold underline
traceback.note = bold #8fd694
traceback.group.border = #c39cf2
# progress
bar.back = #3a3650
bar.complete = #c39cf2
bar.finished = #8fd694
bar.pulse = #c39cf2
progress.description = none
progress.filesize = #8fd694
progress.filesize.total = #8fd694
progress.download = #8fd694
progress.elapsed = #eccb7a
progress.percentage = #c39cf2
progress.remaining = #7fcbd8
progress.data.speed = #8cb4f5
progress.spinner = #c39cf2
status.spinner = #c39cf2
# trees
tree = none
tree.line = #6b6488
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold #f0e8ff on #2c2a3a
markdown.code_block = #e3dcf0 on #24222f
markdown.block_quote = italic #b9b3cc
markdown.list = #7fcbd8
markdown.item = none
markdown.item.bullet = bold #c39cf2
markdown.item.number = #7fcbd8
markdown.hr = #6b6488
markdown.h1.border = #6b6488
markdown.h1 = bold underline #d7b8ff
markdown.h2 = bold #d7b8ff
markdown.h3 = bold #c39cf2
markdown.h4 = italic #c39cf2
markdown.h5 = italic #7fcbd8
markdown.h6 = italic #9a96aa
markdown.h7 = italic #9a96aa
markdown.link = #93bfff
markdown.link_url = underline #93bfff
markdown.s = strike
markdown.table.border = #6b6488
markdown.table.header = bold #d7b8ff
markdown.kbd = bold #f2b880
# dates and times
iso8601.date = #8cb4f5
iso8601.time = #c39cf2
iso8601.timezone = #eccb7a
