# ocean: a dark theme in sea blues, greens and sand, for a dark terminal
# background.
#
# An official rs-rich theme, listed in the plugin marketplace as
# `ocean`. Upstream rich's theme file format (Theme.read: a [styles]
# section of name = style lines), so it works with
# `rich --theme-file ocean.ini` and with Python rich's Theme.read.
#
# The marketplace serves these bytes, pinned in
# crates/rich-cli/tests/fixtures/official-artifacts.txt. A listed
# version never changes: a change here goes out as a new version.
#
# The background it is made for (its contrast is checked against it):
# background: #0f1e2e

[styles]
# inspect
inspect.attr = italic #ffd479
inspect.attr.dunder = italic #8ba3b8
inspect.callable = bold #ff8f85
inspect.async_def = italic #82b8ff
inspect.def = italic #82b8ff
inspect.class = italic #82b8ff
inspect.error = bold #ff8f85
inspect.equals = none
inspect.help = #82b8ff
inspect.doc = #8ba3b8
inspect.value.border = #3f6d8f
live.ellipsis = bold #ff8f85
layout.tree.row = not dim #ff8f85
layout.tree.column = not dim #82b8ff
# logging
logging.keyword = bold #ffd479
logging.level.notset = #8ba3b8
logging.level.debug = #7ee0a8
logging.level.info = #82b8ff
logging.level.warning = #ffd479
logging.level.error = bold #ff8f85
logging.level.critical = bold reverse #ff8f85
log.level = none
log.time = #8ba3b8
log.message = none
log.path = #8ba3b8
# repr (pretty printing and the repr highlighter)
repr.ellipsis = #ffd479
repr.indent = #8ba3b8
repr.error = bold #ff8f85
repr.str = not bold not italic #a8e6a1
repr.brace = bold
repr.comma = bold
repr.ipv4 = bold #7ee0a8
repr.ipv6 = bold #7ee0a8
repr.eui48 = bold #7ee0a8
repr.eui64 = bold #7ee0a8
repr.tag_start = bold
repr.tag_name = bold #4fd1c5
repr.tag_contents = default
repr.tag_end = bold
repr.attrib_name = not italic #ffd479
repr.attrib_equal = bold
repr.attrib_value = not italic #4fd1c5
repr.number = bold not italic #ffcf7a
repr.number_complex = bold not italic #ffcf7a
repr.bool_true = italic #7ee0a8
repr.bool_false = italic #ff8f85
repr.none = italic #4fd1c5
repr.url = not bold not italic underline #9ad0ff
repr.uuid = not bold #ffcf7a
repr.call = bold #4fd1c5
repr.path = #4fd1c5
repr.filename = #82b8ff
# rules
rule.line = #3f6d8f
rule.text = #6fe3d6
# json
json.brace = bold
json.bool_true = italic #7ee0a8
json.bool_false = italic #ff8f85
json.null = italic #4fd1c5
json.number = bold not italic #ffcf7a
json.str = not bold not italic #a8e6a1
json.key = bold #82b8ff
# prompts
prompt = none
prompt.choices = bold #4fd1c5
prompt.default = bold #82b8ff
prompt.invalid = #ff8f85
prompt.invalid.choice = #ff8f85
pretty = none
# scope
scope.border = #3f6d8f
scope.key = italic #ffd479
scope.key.special = italic #8ba3b8
scope.equals = #ff8f85
# tables
table.header = bold #6fe3d6
table.footer = bold
table.cell = none
table.title = italic #6fe3d6
table.caption = italic #8ba3b8
# tracebacks
traceback.error = italic #ff8f85
traceback.border.syntax_error = #ff8f85
traceback.border = #ff8f85
traceback.text = none
traceback.title = bold #ff8f85
traceback.exc_type = bold #ff8f85
traceback.exc_value = none
traceback.offset = bold #ff8f85
traceback.error_range = bold underline
traceback.note = bold #7ee0a8
traceback.group.border = #4fd1c5
# progress
bar.back = #1e3a52
bar.complete = #4fd1c5
bar.finished = #7ee0a8
bar.pulse = #4fd1c5
progress.description = none
progress.filesize = #7ee0a8
progress.filesize.total = #7ee0a8
progress.download = #7ee0a8
progress.elapsed = #ffd479
progress.percentage = #4fd1c5
progress.remaining = #82b8ff
progress.data.speed = #82b8ff
progress.spinner = #4fd1c5
status.spinner = #4fd1c5
# trees
tree = none
tree.line = #3f6d8f
# markdown
markdown.paragraph = none
markdown.text = none
markdown.em = italic
markdown.emph = italic
markdown.strong = bold
markdown.code = bold #e6f6ff on #17324c
markdown.code_block = #d6ecf5 on #132a40
markdown.block_quote = italic #a9c4d6
markdown.list = #82b8ff
markdown.item = none
markdown.item.bullet = bold #4fd1c5
markdown.item.number = #82b8ff
markdown.hr = #3f6d8f
markdown.h1.border = #3f6d8f
markdown.h1 = bold underline #6fe3d6
markdown.h2 = bold #6fe3d6
markdown.h3 = bold #4fd1c5
markdown.h4 = italic #4fd1c5
markdown.h5 = italic #82b8ff
markdown.h6 = italic #8ba3b8
markdown.h7 = italic #8ba3b8
markdown.link = #9ad0ff
markdown.link_url = underline #9ad0ff
markdown.s = strike
markdown.table.border = #3f6d8f
markdown.table.header = bold #6fe3d6
markdown.kbd = bold #ffcf7a
# dates and times
iso8601.date = #82b8ff
iso8601.time = #4fd1c5
iso8601.timezone = #ffd479
