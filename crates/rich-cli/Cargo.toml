# crates/rich-cli — binary that mirrors the Python `rich-cli` command-line tool.
#
# ⚠️  VERSION POLICY: this crate's version mirrors the upstream `rich-cli`
# release (a DIFFERENT project from the `rich` library — it versions separately).
# See UPSTREAM.toml and AGENTS.md.
[package]
name = "rich-cli"
version = "1.8.1"
description = "A Rust port of the `rich-cli` terminal toolbox, built on the `rich` crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rich-cli"
keywords = ["cli", "terminal", "markdown", "syntax", "pretty-print"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[[bin]]
name = "rich"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["fetch", "art"]
# `fetch` enables the CLI's URL support (`rich <url>`); disable it
# (`--no-default-features`) for a lean, network-free build.
fetch = ["dep:ureq"]
# `art` enables `--gif` (animated GIF playback). Pulls in image decoders, so it
# can be dropped for a smaller binary.
art = ["dep:rich-art"]

[dependencies]
rich.workspace = true
rich-ext.workspace = true
serde_json.workspace = true
ureq = { workspace = true, optional = true }
rich-art = { workspace = true, optional = true, features = ["gif"] }
