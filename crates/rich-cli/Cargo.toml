# crates/rich-cli — binary that mirrors the Python `rich-cli` command-line tool.
#
# VERSION POLICY: the crates.io package `rs-rich-cli` follows independent SemVer;
# its version does not mirror the upstream Python `rich-cli` release. The tracked
# upstream release is recorded in UPSTREAM.toml. This package installs `rich`.
[package]
name = "rs-rich-cli"
version = "0.0.16"
description = "The `rich` executable: a Rust port of Python `rich-cli` 1.8.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cli", "terminal", "markdown", "syntax", "pretty-print"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

# The command line is a library target so the Python wheel (`crates/rich-py`)
# can run it in-process; its only public item is `rich_cli::run`.
[lib]
name = "rich_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rich"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Optional parser reuse; disabled in the default mirror (DIVERGENCES #23).
syntax-cache = ["rich/syntax-cache"]
# Oniguruma regex engine for syntax highlighting (DIVERGENCES #26).
onig = ["rich/onig"]
default = ["fetch", "art", "mermaid", "record", "interact"]
# Optional JSON display divergence; never enabled by default.
json-escape-safe = ["rich/json-escape-safe"]
# `fetch` enables the CLI's URL support (`rich <url>`); disable it
# (`--no-default-features`) for a lean, network-free build.
fetch = ["dep:ureq"]
# `art` enables `--gif` (animated GIF playback), `--diff` (perceptual image
# diffing) and the image renderers behind `--image-mode`, including Sixel,
# and the micro assets: `rich micro`, `:micro:` in `--print --emoji`, and
# (with `interact`) `rich asset --kind micro` and `rich explore --icons`.
# Pulls in image decoders, so it can be dropped for a smaller binary.
art = ["dep:rich-art", "dep:rich-micro", "rich-interact?/micro"]
# `rich mermaid FILE` and ```mermaid fences in `rich --markdown`, drawn as text.
mermaid = ["dep:rich-mermaid"]
# The `mmdc` Mermaid backend (Mermaid's CLI: Node and headless Chromium,
# installed separately). Off by default because it starts a browser.
mmdc = ["mermaid", "art", "rich-mermaid/mmdc"]
# `rich record TAPE`: run scripted terminal sessions and render screenshots,
# asciinema casts, GIF and MP4 (rs-rich-record, #599). Pulls in a PTY, a VT
# emulator and an embedded font.
record = ["dep:rich-record"]
# `rich choose`, `filter`, `input`, `confirm` and `pager`: the rs-rich-interact
# components as shell commands (#493, #494).
interact = ["dep:rich-interact"]
# The lumis (tree-sitter) code highlighter, chosen with `--highlighter lumis`.
# Off by default: it compiles lumis's grammars (a much larger binary) and needs
# Rust 1.91.
lumis = ["dep:rich-lumis"]
# Runtime plugins, loaded with `--plugin PATH` or from a trusted config's
# `plugins` list (never from a project's ./rich.toml). Both off by default:
# `dylib-plugins` loads native libraries (they run arbitrary code), and
# `wasm-plugins` sandboxed WASM modules (wasmi; no imports, fuel and memory
# limits). See docs/PLUGINS.md.
dylib-plugins = ["rich-ext/dylib-plugins"]
wasm-plugins = ["rich-ext/wasm-plugins"]
# `rich schema` reading Arrow IPC files (`.arrow`, `.feather`, `.arrows`,
# `.ipc`) through rs-rich-data's Arrow adapter. Off by default: it compiles
# the Arrow array and IPC crates. Without it an Arrow input is a usage error
# that names this feature.
arrow = ["rich-data/arrow"]

[dependencies]
rich = { workspace = true, features = ["syntax", "markdown"] }
rich-ext = { workspace = true, features = ["data", "yaml", "toml", "xml", "jsonpath", "serde", "testing"] }
terminal_size.workspace = true
serde_json.workspace = true
ureq = { workspace = true, optional = true }
rich-art = { workspace = true, optional = true, features = ["gif", "sixel"] }
rich-mermaid = { workspace = true, optional = true }
# `rich dot` and ```dot fences (the DOT plugin), `rich deps --graph`, and
# Graphviz's own SVG for `--dot-backend graphviz --export-svg`.
rich-diagram = { workspace = true, features = ["plugin", "graphviz"] }
# The CSV/TSV sniffer and reader behind `--csv` and `rich chart`, `--infer`,
# `rich profile`, and the ER diagrams of `rich schema --er`.
rich-data = { workspace = true, features = ["er"] }
rich-record = { workspace = true, optional = true }
rich-interact = { workspace = true, optional = true, features = ["data"] }
rich-lumis = { workspace = true, optional = true }
rich-micro = { workspace = true, optional = true }

toml = "1.1"
tempfile = "3"
same-file = "1"
ctrlc = "3.4"
notify.workspace = true
cap-std = "4"
cap-fs-ext = "4"
fastrand = "2"

[target."cfg(unix)".dependencies]
# Kill a `--preview` command's whole process group, not just its shell.
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
# PTY tests for the interactive commands: a real terminal, keys sent to it.
portable-pty = "0.9"
vt100 = "0.16"
# The WASM plugin tests compile the example module from text.
wat = "1"
