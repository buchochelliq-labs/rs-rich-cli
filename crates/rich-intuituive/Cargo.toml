# crates/rich-intuituive — intuiTUIve, the rs-rich TUI framework (milestone 11).
#
# Not a port of anything upstream: an rs-rich addition. A retained tree of
# nodes with fine-grained reactive state, drawn into a retained cell screen
# with damage tracking, on top of rs-rich-interact's sessions, drivers and
# components. See docs/design/intuituive.md. Independent SemVer from 0.0.1.
[package]
name = "rs-rich-intuituive"
version = "0.0.4"
description = "intuiTUIve: a reactive, retained terminal UI framework built on rs-rich"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rs-rich-intuituive"
keywords = ["terminal", "tui", "reactive", "framework", "rich"]
categories = ["command-line-interface"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

# The image nodes, the file watcher, the file components and raw PCM on
# docs.rs too; `audio` is left out,
# as its ALSA headers may not be there to build it.
[package.metadata.docs.rs]
features = ["art", "watch", "files", "archive", "pcm"]

[lib]
name = "intuituive"

[lints]
workspace = true

[features]
# `App::run_with(BackendKind::Termion)`: the termion backend of
# rs-rich-interact (Unix only).
termion = ["rich-interact/termion"]
# `App::run_with(BackendKind::Termwiz)`: the termwiz backend of
# rs-rich-interact.
termwiz = ["rich-interact/termwiz"]
# `audio::pcm`, `audio::Format`, `audio::deinterleave`, `audio::Frame`
# and `audio::Matrix`: raw PCM read a buffer at a time, the light base of
# the sound plugin, with no dependency. `audio` and `wav` turn it on.
# Off by default.
pcm = []
# `audio::input`, `audio::open`, `audio::devices` and `audio::picker`:
# capture from a sound card through cpal (ALSA on Linux, which needs
# libasound2-dev to build; CoreAudio on macOS; WASAPI on Windows), with
# alsa-sys to keep ALSA's messages off the screen. Off by default.
audio = ["pcm", "dep:cpal", "dep:alsa-sys"]
# `audio::Host::Pulse`: PulseAudio and PipeWire sources (a sink's monitor
# among them) through cpal's own PulseAudio client, pure Rust: no system
# library beyond `audio`'s. Off by default.
pulse = ["audio", "cpal/pulseaudio"]
# `audio::wav`, `audio::wav_writer` and `audio::record`: WAV files in and
# out, through hound (pure Rust). Off by default.
wav = ["pcm", "dep:hound"]
# `watch_path`: wake the app when files change, through notify (inotify,
# FSEvents, ReadDirectoryChangesW, kqueue). Off by default.
watch = ["dep:notify"]
# `image`: an image file as a node, drawn by rs-rich-art in half blocks
# (or quadrants, Braille, ASCII). Off by default.
art = ["dep:rich-art", "rich-art/image"]
# `files`: a file manager's components (Miller columns, file lists,
# previews by type, a watched directory model, background file jobs with
# progress, a streaming fuzzy finder), on rs-rich-ext's `listing`, `open`,
# `file_ops`, `trash` and `git`. Local times through rs-rich-ext's
# `local-time` (chrono). Off by default.
files = ["rich-ext/local-time"]
# `files` with archive previews and extraction (tar, tar.gz, zip) through
# rs-rich-ext's `archive` (zip, flate2). Off by default.
archive = ["files", "rich-ext/archive"]

# The scope-tui rebuild reads raw PCM (`audio::pcm`), the `pcm` plugin's.
[[example]]
name = "scope"
required-features = ["pcm"]

[dependencies]
rich.workspace = true
rich-ext.workspace = true
rich-interact.workspace = true
cpal = { version = "0.18.2", optional = true }
hound = { version = "3.5", optional = true }
notify = { workspace = true, optional = true }
rich-art = { workspace = true, optional = true }
# Node::solver(Solver::Ratatui): ratatui's constraint solver (its fork of
# cassowary), so a row ported from ratatui lays out as it did.
kasuari = "0.4"

# The `audio` feature's ALSA error handler (`snd_lib_error_set_local`);
# cpal links the same library already.
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = { version = "0.4", optional = true }

[dev-dependencies]
# The Yazi example (examples/files.rs) shows times in the local time zone
# with rs-rich-ext's `fs::local_time`, behind its `local-time` feature.
rich-ext = { workspace = true, features = ["local-time"] }
# PTY tests: an app run on every backend gives the terminal back
# (tests/backends.rs).
portable-pty = "0.9"
vt100 = "0.16"
# The benchmark against ratatui (tests/versus_ratatui.rs) draws the same
# dashboard with it. A dev-dependency only: the framework does not use it.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
# The porting guide's claim that ratatui widgets run unchanged inside an
# app (tests/ratatui_widgets.rs). Path only, so `cargo publish` drops it:
# a published crate need not wait on its dev-dependencies.
rich-ratatui = { package = "rs-rich-ratatui", path = "../rich-ratatui", features = ["interact"] }

# The Yazi clone is built from the `files` feature's components.
[[example]]
name = "files"
required-features = ["files"]
