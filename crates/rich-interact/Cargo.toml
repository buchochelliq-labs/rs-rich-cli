# crates/rich-interact — interactive components between static rendering and a
# full TUI (#451).
#
# Not a port of anything upstream: an rs-rich addition. Components are state
# machines (one event in, one view out) run by a blocking call or an event
# loop, painted through rich-ext's frame diff, with a headless driver for
# tests and a degradation policy for pipes and CI. Independent SemVer from
# 0.0.1.
[package]
name = "rs-rich-interact"
version = "0.0.12"
description = "Interactive terminal components for rs-rich: event loop, viewport, item model, headless testing"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rs-rich-interact"
keywords = ["terminal", "interactive", "tui", "prompt", "cli"]
categories = ["command-line-interface"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[lib]
name = "rich_interact"

[lints]
workspace = true

[features]
default = ["syntax"]
# Syntax highlighting through syntect: the file picker's code previews, and
# rs-rich-ext's default features (`syntax`, `markdown`). On by default; an
# app built for a browser (the docs playground) turns it off to leave
# syntect out, and a preview then shows the code as plain text.
syntax = ["rich/syntax", "rich-ext/syntax", "rich-ext/markdown"]
# `DataExplorer`: explore a JSON, YAML, TOML, XML, INI or dotenv document
# (#465), parsed by rich-ext's data layer.
data = ["rich-ext/data"]
# Micro assets (rs-rich-micro): `AssetKind::Micro` in `AssetPicker`, and
# `StatusItem::micro`. Pulls in image decoding.
micro = ["dep:rich-micro"]
# `vim::Vim`: a Vim preset for the text editors (modes, motions, operators,
# counts and `.`), a `KeyMode` over `edit::Buffer`. Off by default.
vim = []
# The termion backend (#677): `BackendKind::Termion`, Unix only (on other
# platforms the feature compiles to nothing).
termion = ["dep:termion"]
# The termwiz backend (#678): `BackendKind::Termwiz`, on Unix and Windows.
termwiz = ["dep:termwiz"]

[[example]]
name = "explore"
required-features = ["data"]

[[example]]
name = "guide_explorers"
required-features = ["data"]

[[example]]
name = "micro_showcase"
required-features = ["micro"]

[[test]]
name = "explore"
required-features = ["data"]

[[test]]
name = "explore_scale"
required-features = ["data"]

[dependencies]
rich.workspace = true
# Without its defaults, so `syntax` decides whether syntect comes in. A
# path dependency, as a workspace one cannot turn its defaults off.
rich-ext = { package = "rs-rich-ext", path = "../rich-ext", version = "0.0.21", default-features = false }
# The text buffer's search (`edit::Search`): plain strings and regular
# expressions (already in the tree, through rs-rich).
fancy-regex.workspace = true
rich-micro = { workspace = true, optional = true }
# The termwiz backend (MIT), off by default: wezterm's terminal layer, with
# its own input parser and capability probe.
termwiz = { version = "0.23", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Raw mode, the alternate screen, and key and mouse events on every platform.
# `use-dev-tty` reads events through poll/select instead of mio: macOS's
# kqueue cannot watch `/dev/tty` (keys when stdin is a pipe, as in
# `seq 1 99 | rich pager`), and its edge-triggered read filter misses keys
# typed while the session was suspended. One event source on every Unix.
# Not on wasm32: a browser has no terminal. There `crossterm_stub` stands in
# (every call fails with `Unsupported`), and a page drives the loop through
# `EventLoop::step` and `PushBackend` (the docs playground). CI checks the
# wasm32-unknown-unknown build.
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "windows", "use-dev-tty"] }

[target.'cfg(unix)'.dependencies]
# The termion backend (MIT), off by default and Unix only.
termion = { version = "4", optional = true }
# A timed wait on the terminal, for the start-up query and the termion and
# termwiz backends' reads (crossterm's `use-dev-tty` already depends on it).
filedescriptor = "0.8"
# Restore the terminal on SIGTERM, SIGHUP and SIGQUIT. crossterm 0.29 still
# depends on 0.3; both share one signal-hook-registry, so their handlers
# chain.
signal-hook = "0.4"
# O_NONBLOCK, to open a file for its preview without blocking (crossterm
# already depends on it).
libc = "0.2"

# The local time zone (`datetime::Zone::Local`) through
# `SystemTimeToTzSpecificLocalTime` (already in the tree, through
# rs-rich-ext).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[dev-dependencies]
# Every format the data explorer reads, in its tests.
rich-ext = { workspace = true, features = ["data", "yaml", "toml", "xml"] }
# Plugin-registered actions (#491), in tests.
rich-plugin-api.workspace = true
# Directories for the file picker's tests.
tempfile = "3"
# PTY tests: the terminal is restored after every way out.
portable-pty = "0.9"
vt100 = "0.16"
