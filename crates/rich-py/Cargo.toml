# Python bindings for rs-rich (PyPI `rs-rich`, `import rs_rich`). Built with
# maturin into a wheel; never published to crates.io.
#
# Outside the Cargo workspace (see the root `exclude`): PyO3's build script
# needs a Python interpreter, which the workspace's jobs should not. Built and
# tested by `.github/workflows/python.yml`.
[package]
name = "rs-rich-py"
version = "0.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/buchochelliq-labs/rs-rich-cli"
description = "Python bindings for rs-rich (the rs-rich wheel on PyPI)"
publish = false
rust-version = "1.90"

[lib]
name = "rs_rich_native"
crate-type = ["cdylib"]

[dependencies]
rich = { package = "rs-rich", path = "../rich" }
# Everything the Rust crates expose is exposed to Python (0.0.12 workstream 8).
rich-ext = { package = "rs-rich-ext", path = "../rich-ext", features = ["data", "yaml", "toml", "xml", "jsonpath", "test-report", "serde", "testing"] }
rich-art = { package = "rs-rich-art", path = "../rich-art", features = ["image", "gif", "sixel"] }
rich-mermaid = { package = "rs-rich-mermaid", path = "../rich-mermaid" }
# `rs_rich.diagram`: graphs, their layered layout and DOT (0.0.15
# workstream 5).
rich-diagram = { package = "rs-rich-diagram", path = "../rich-diagram" }
# `rs_rich.micro`: micro assets, their registry, markup and pipeline
# (0.0.14 workstream 7).
rich-micro = { package = "rs-rich-micro", path = "../rich-micro" }
rich-plugin-api = { package = "rs-rich-plugin-api", path = "../rich-plugin-api" }
# `rs_rich.interact`: the interactive components, their headless driver and
# the fuzzy matcher (0.0.13 workstream 5).
rich-interact = { package = "rs-rich-interact", path = "../rich-interact", features = ["micro"] }
# The `rich` command line, run in-process by `python -m rs_rich`: the default
# features except `record`, whose PTY recorder runs the `rich` binaries beside
# the running executable (here, Python) and has no place in a wheel.
rich-cli = { package = "rs-rich-cli", path = "../rich-cli", default-features = false, features = ["fetch", "art", "mermaid", "interact"] }
# The tree-sitter highlighter: a separate, much larger wheel.
rich-lumis = { package = "rs-rich-lumis", path = "../rich-lumis", optional = true }
# rich-ext's reports and assertions, as its `testing` feature serialises them.
serde = "1"
serde_json = "1"
# One abi3 wheel per platform covers CPython 3.9 and later.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# How much native stack is left on the calling thread (read only; nothing
# switches stacks, which CPython's own stack checks would not follow).
stacker = "0.1"

[features]
# maturin turns this on for wheels; plain `cargo check` leaves it off.
extension-module = ["pyo3/extension-module"]
# Mermaid's `mmdc` backend (needs Mermaid's CLI installed separately).
mmdc = ["rich-mermaid/mmdc"]
# `lumis` as a code highlighter; built as its own wheel.
lumis = ["dep:rich-lumis", "rich-cli/lumis"]

# Its own workspace root, so the repository's workspace never builds it.
[workspace]
