# crates/rich — FAITHFUL port of the Python `rich` library.
#
# ⚠️  VERSION POLICY: this crate owns an independent Rust SemVer. It does not
# mirror Python `rich`; UPSTREAM.toml records that separately. Bump it for
# changes shipped in this crate, never to ship an extension-only feature. The
# release tag selects a coordinated or per-crate upload; see docs/BRANCHING.md.
[package]
name = "rs-rich"
version = "0.0.9"
description = "A faithful Rust port of the Python `rich` terminal-rendering library"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
# Must match the PACKAGE name, not the lib name: `docs.rs/rich` is a real,
# unrelated crate, and crates.io metadata cannot be edited after publishing.
documentation = "https://docs.rs/rs-rich"
keywords = ["terminal", "console", "ansi", "formatting", "tui"]
categories = ["command-line-interface", "text-processing"]
# Keep the published tarball lean: sources, licence and readme only. Without
# this, `tests/golden/*` fixtures and any stray files would ship too.
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[lib]
# The package is `rs-rich` on crates.io (plain `rich` is taken), but the
# library target keeps the short name so users write `use rich::…`.
name = "rich"

[lints]
workspace = true

[features]
# `Syntax` and the syntect highlighter (with syntect's bundled grammars and
# themes). On by default; turn it off (`default-features = false`) when an
# application never highlights code, to drop syntect and what it pulls in.
syntax = ["dep:syntect"]
# `Markdown`, parsed with pulldown-cmark. Code blocks are highlighted by
# `Syntax`, so this turns `syntax` on too. On by default.
markdown = ["dep:pulldown-cmark", "syntax"]
# Optional parser reuse; disabled in the default mirror (DIVERGENCES #23).
syntax-cache = ["syntax"]
# Oniguruma (C) as syntect's regex engine instead of pure-Rust fancy-regex:
# faster highlighting, same grammars and themes (DIVERGENCES #26).
onig = ["syntax", "syntect/regex-onig"]
# The default build is the whole mirror: everything upstream `rich` has.
default = ["syntax", "markdown"]
# Explicit opt-in to JSON escape-aware display boundaries (DIVERGENCES #22).
json-escape-safe = []

[dependencies]
terminal_size.workspace = true
serde_json.workspace = true
fancy-regex.workspace = true
pulldown-cmark = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }
anstyle-query = "1.1.5"

# Targets that exercise `Syntax` or `Markdown` need them; the rest also run
# in the lean build (`--no-default-features`), which CI checks.

[[test]]
name = "golden"
required-features = ["syntax", "markdown"]

[[test]]
name = "golden_api_gaps"
required-features = ["syntax", "markdown"]

[[test]]
name = "golden_audit2"
required-features = ["syntax", "markdown"]

[[test]]
name = "golden_audit_edges"
required-features = ["syntax", "markdown"]

[[test]]
name = "golden_upstream_features"
required-features = ["syntax", "markdown"]

[[test]]
name = "code_seams"
required-features = ["syntax", "markdown"]

[[test]]
name = "edge_values"
required-features = ["syntax", "markdown"]

[[example]]
name = "guide_code"
required-features = ["syntax", "markdown"]

[[example]]
name = "screenshot"
required-features = ["syntax", "markdown"]
