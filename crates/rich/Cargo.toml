# crates/rich — FAITHFUL port of the Python `rich` library.
#
# ⚠️  VERSION POLICY: this crate's version mirrors the upstream `rich` release it
# reflects (see UPSTREAM.toml). It is bumped ONLY when syncing a new upstream
# release — never to ship one of our own features. Local features live in
# `rich-ext`. See AGENTS.md.
[package]
name = "rs-rich"
version = "15.0.0"
description = "A faithful Rust port of the Python `rich` terminal-rendering library"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rich"
keywords = ["terminal", "console", "ansi", "formatting", "tui"]
categories = ["command-line-interface", "text-processing"]
# Keep the published tarball lean: sources, licence and readme only. Without
# this, `tests/golden/*` fixtures and any stray files would ship too.
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[lib]
# The package is `rs-rich` on crates.io (plain `rich` is taken), but the
# library target keeps the short name so users write `use rich::…`.
name = "rich"

[lints]
workspace = true

[dependencies]
unicode-width.workspace = true
terminal_size.workspace = true
serde_json.workspace = true
fancy-regex.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
