<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #101010; color: #d0d0d0; }
  #terminal { position: absolute; inset: 0; padding: 4px; box-sizing: border-box; }
  #status {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 4px; background: #2a2a2a; color: #f0f0f0;
    font: 14px system-ui, sans-serif;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body data-mode="{{mode}}">
<div id="terminal"></div>
<div id="status" role="status" aria-live="polite" hidden></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="app.js"></script>
</body>
</html>
