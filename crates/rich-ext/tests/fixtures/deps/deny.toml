# cargo-deny's configuration. `rich deps --policy deny.toml` reads its
# [licenses] section and leaves the rest to cargo-deny.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["LicenseRef-Acme-EULA"], name = "acme-telemetry", version = "1" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
