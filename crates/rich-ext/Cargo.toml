# crates/rich-ext — OUR additions on top of the faithful core.
#
# Like every crate in this repository, this crate carries an independent SemVer
# that started at 0.0.1 and is bumped only when this crate is selected for a
# release; it never mirrors an upstream version. All local features + the
# internal plugin registry live here so the core stays a clean mirror. See
# AGENTS.md → Versioning.
[package]
name = "rs-rich-ext"
version = "0.0.10"
description = "Extensions for the `rich` Rust port: diagnostics, structured data, clap and tracing integration, diffs, workflow renderables and a plugin registry"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
# Must match the PACKAGE name, not the lib name: `docs.rs/rich` is a real,
# unrelated crate, and crates.io metadata cannot be edited after publishing.
documentation = "https://docs.rs/rs-rich-ext"
keywords = ["terminal", "console", "diagnostics", "clap", "tracing"]
categories = ["command-line-interface", "text-processing"]
include = ["src/**/*", "examples/**/*", "README.md", "LICENSE", "Cargo.toml"]


[package.metadata.docs.rs]
# Show every feature-gated module (data, qa, testing, adapters, macros…) on docs.rs.
all-features = true

[lib]
# The package is `rs-rich-ext` on crates.io (plain `rich` is taken), but the
# library target keeps the short name so users write `use rich_ext::…`.
name = "rich_ext"

[lints]
workspace = true

[dependencies]
rich.workspace = true
rich-plugin-api.workspace = true
rich-macros = { workspace = true, optional = true }
fancy-regex.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
saphyr-parser = { version = "0.1", optional = true }
toml = { version = "1.1", optional = true }
quick-xml = { version = "0.42", optional = true }

anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }
# `cli_doc::clap` adapter: reads `Command` metadata and maps `Error`s. `help` is
# only there because without it clap drops its `-h/--help` flag; no `usage` or
# `color` — rich renders those. `error-context` and `suggestions` populate
# `Error::context()` (invalid arg/value, "did you mean").
clap = { version = "4.5", default-features = false, features = ["std", "help", "env", "error-context", "suggestions"], optional = true }

[dev-dependencies]
serde_json.workspace = true
thiserror = "2"
trybuild = "1"

[features]
default = []
anyhow = ["dep:anyhow"]
# richf!, style!, theme_key!, markup!, #[derive(Rich)] and the print macros.
macros = ["dep:rich-macros"]
log = ["dep:log"]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
testing = ["dep:serde", "dep:serde_json"]
# `Serialize` for capability reports, contrast findings and ANSI explanations.
serde = ["dep:serde"]
# JUnit XML / libtest JSON test results and the `TestReport` renderable.
test-report = ["dep:serde", "dep:serde_json", "dep:quick-xml"]
# Structured data (`rich_ext::data`): the format-neutral document model, the
# explorer, table/flatten/search/diff/redaction views and the serde helpers,
# with JSON, INI and dotenv parsers (hand-written; no extra deps).
data = ["dep:serde", "dep:serde_json"]
# YAML parsing through an event parser, so anchors, aliases and positions survive.
yaml = ["data", "dep:saphyr-parser"]
# TOML parsing with spans (dates render as written).
toml = ["data", "dep:toml"]
# XML parsing (streaming; attributes become `@name` keys).
xml = ["data", "dep:quick-xml"]
# The built-in JSONPath selection backend for `data::select`.
jsonpath = ["data"]
# CLI authoring through clap: `cli_doc::clap` maps a `clap::Command` onto
# the help, error, completion and docs renderers.
clap = ["dep:clap"]

[[example]]
name = "snapshot"
required-features = ["testing"]

[[example]]
name = "log_adapter"
required-features = ["log"]

[[example]]
name = "tracing_adapter"
required-features = ["tracing"]

[[example]]
name = "rich_handler"
required-features = ["log", "tracing"]

[[example]]
name = "structured_data"
required-features = ["data"]

[[example]]
name = "clap_help"
required-features = ["clap"]

# User-guide examples for docs/guide/ext (output, diagnostics, authoring).
[[example]]
name = "guide_diagnostics"
required-features = ["anyhow"]

[[example]]
name = "guide_logging"
required-features = ["log", "tracing"]

[[example]]
name = "guide_macros"
required-features = ["macros"]

# User-guide examples for docs/guide/ext (data, CLI, diffs, QA, capabilities).
[[example]]
name = "guide_data"
required-features = ["data", "yaml", "toml", "xml", "jsonpath"]

[[example]]
name = "guide_clap"
required-features = ["clap"]

[[example]]
name = "guide_diff"
required-features = ["testing", "test-report"]

[[example]]
name = "guide_qa"
required-features = ["testing"]

[[example]]
name = "guide_transforms"
required-features = ["jsonpath"]
test = true

[[example]]
name = "guide_highlighters"
required-features = ["testing"]
# Its adapter's conformance test runs with `cargo test`.
test = true

[[example]]
name = "guide_capabilities"
required-features = ["serde"]

[[example]]
name = "guide_a11y"
required-features = ["serde"]
