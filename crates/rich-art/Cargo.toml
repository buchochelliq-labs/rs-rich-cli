# crates/rich-art — ASCII-art renderables (FIGlet banners, and later image art).
#
# ⚠️  NOT a port. This crate is OUR OWN feature, not a mirror of anything
# upstream, so it carries its own SemVer (like rich-ext) and must never be
# version-locked to `rich`/`rich-cli`. See AGENTS.md → Versioning.
#
# It is deliberately self-contained: it depends only on `rich` (for the
# `Renderable` trait) so it can be lifted into its own repository unchanged.
[package]
name = "rs-rich-art"
version = "0.0.1"
description = "ASCII-art renderables for `rich` — FIGlet-style text banners"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
# Must match the PACKAGE name, not the lib name: `docs.rs/rich` is a real,
# unrelated crate, and crates.io metadata cannot be edited after publishing.
documentation = "https://docs.rs/rs-rich-art"
keywords = ["ascii-art", "figlet", "terminal", "gif", "banner"]
categories = ["command-line-interface", "multimedia::images", "text-processing"]
# The bundled FIGfont and the demo GIFs are part of the package; the example
# assets are small and make the examples runnable from a published copy.
include = [
    "src/**/*",
    "fonts/**/*",
    "examples/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[features]
default = []
# `image` enables image -> ASCII/ANSI art (jp2a-style). Off by default so the
# crate stays dependency-free for the FIGlet banners alone.
image = ["dep:image"]
# `gif` adds animated-GIF playback, driven by `rich`'s Live display.
gif = ["image"]

# The image/GIF examples only build when their feature is on.
[[example]]
name = "banner"

[[example]]
name = "gif"
required-features = ["gif"]

[[example]]
name = "make_demo_gif"
required-features = ["gif"]

[[example]]
name = "stage"
required-features = ["gif"]

[[example]]
name = "shrink_asset"
required-features = ["gif"]

[lib]
# The package is `rs-rich-art` on crates.io (plain `rich` is taken), but the
# library target keeps the short name so users write `use rich_art::…`.
name = "rich_art"

[lints]
workspace = true

[dependencies]
rich.workspace = true
image = { workspace = true, optional = true }
