# crates/noctiluca — Noctiluca, a terminal web browser on intuiTUIve.
#
# Not a port of anything upstream: an rs-rich addition. Its design is
# docs/design/browser.md. The reader phase: a page read through
# rs-rich-embed's ChromeEngine (DevTools, sandbox on), drawn as terminal
# text in an intuiTUIve app, its controls as stock widgets. Independent
# SemVer from 0.0.1.
[package]
name = "noctiluca"
version = "0.0.5"
description = "A terminal web browser: page text as terminal text, media as media"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/noctiluca"
keywords = ["terminal", "browser", "tui", "chrome", "rich"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "tests/snapshots/source-native/**/*",
    "README.md",
    "LICENSE",
    "config.sample.toml",
    "Cargo.toml",
]

[lints]
workspace = true

[[bin]]
name = "noctiluca"
path = "src/main.rs"

[[test]]
name = "pty"
required-features = ["fake-engine"]

[features]
# Test-only: the binary replays saved snapshots from the directory
# `NOCTILUCA_FAKE_ENGINE` names, instead of starting Chrome (the PTY test
# and the docs tape, with no browser). Off, the variable is ignored.
fake-engine = []
# Decode AVIF pictures from the bytes the page loaded (rs-rich-art's `avif`,
# which links libdav1d: `apt install libdav1d-dev`, `brew install dav1d`).
# Off, an AVIF picture is drawn from Chrome's own pixels of its box.
avif = ["rich-art/avif"]

[dependencies]
rich.workspace = true
rich-embed = { workspace = true, features = ["chrome"] }
rich-intuituive = { workspace = true, features = ["art"] }
# `--split DIR`: open Noctiluca in a split of the terminal (its `host`
# client, #820), and the control socket agents drive it through (its
# `control` piece, #816: a Unix socket, a named pipe on Windows).
rich-interact = { workspace = true, features = ["host", "control"] }
# Pictures: decoding, animations, the byte budget and its step down;
# video frames' pacing and the protocol each region steps down to.
rich-art = { workspace = true, features = ["frames"] }
serde_json.workspace = true
# Stills of image regions in tests, and their decoding through rs-rich-art.
image = { workspace = true }
# The config file: read with toml, edited with toml_edit so the user's
# comments and layout survive.
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# `--ssh`: ssh is stopped when Noctiluca dies (`PR_SET_PDEATHSIG`).
libc = "0.2"

[dev-dependencies]
rich-ext.workspace = true
# The end-to-end test: the binary on a PTY, read through rs-rich-record's
# VT emulator.
rich-record.workspace = true
portable-pty = "0.9"
vt100 = "0.16"
