<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Log</title>
<!-- One live log, built from <ul>: log-ul.html and log-div.html hold
     the same entries in different constructs, and project the same. -->
<style>
  body { margin: 8px; font: 16px sans-serif }
  #log { display: block; list-style: none; margin: 0; padding: 0; width: 400px; height: 144px; overflow-y: auto }
  #log > * { display: block; margin: 0; padding: 0 }
  .author { font-weight: bold }
  img { width: 18px; height: 18px; vertical-align: middle }
</style>
<h1>Messages</h1>
<ul id="log" aria-live="polite" aria-label="Messages">
  <li><span class="author" style="color: #ff7f50">ada</span>: first light</li>
  <li><span class="author" style="color: #9acd32">bea</span>: it glows <img alt=":glow:" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Ccircle cx='9' cy='9' r='8' fill='%2335d0ff'/%3E%3C/svg%3E"></li>
  <li><span class="author" style="color: #ff7f50">ada</span>: <em>so</em> blue</li>
</ul>
<p>Under the log.</p>
<script>
  // The page's own script appends, as a live log's does.
  const log = document.getElementById('log');
  window.post = (author, words) => {
    const row = document.createElement('li');
    const who = document.createElement('span');
    who.className = 'author'; who.style.color = '#da70d6'; who.textContent = author;
    row.append(who, ': ' + words);
    log.append(row);
  };
</script>
