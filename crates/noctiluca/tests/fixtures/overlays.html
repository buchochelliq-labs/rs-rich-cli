<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Fixture Streams</title>
<!-- Written for Noctiluca's corpus, reduced from the general shape of a
     live-streaming site's channel page (not copied from any site): a top
     bar fixed to the top whose right end is a run of icon buttons with long
     accessible names; a player (a video) with the page's offline art, a
     picture, laid over it in a box of its own; thumbnails with their
     duration, LIVE and viewer badges drawn over the picture; a player's own
     error panel hidden under an opaque interstitial painted above it; and
     a sign-up bar fixed to the bottom of the screen. Every layer is
     positioned, so paint order decides what shows. -->
<style>
  body { font: 14px/1.3 sans-serif; margin: 0; padding-top: 50px; color: #0e0e10; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #18181b; color: #fff;
         display: flex; align-items: center; gap: 12px; padding: 0 8px; z-index: 3; }
  .top .search { flex: 1; }
  .top .icons { display: flex; gap: 4px; }
  .top button { width: 30px; height: 30px; overflow: hidden; white-space: nowrap; }
  .player { position: relative; width: 640px; height: 360px; margin: 12px; }
  .player video { width: 640px; height: 360px; background: #000; display: block; }
  .player .art { position: absolute; left: 270px; top: 130px; }
  .player .art img { width: 100px; height: 100px; display: block; }
  .row { display: flex; gap: 12px; margin: 12px; }
  .thumb { position: relative; width: 320px; height: 180px; }
  .thumb img { width: 320px; height: 180px; display: block; }
  .badge { position: absolute; background: #000; color: #fff; font-size: 12px; padding: 0 4px; }
  .duration { right: 6px; bottom: 6px; }
  .live { left: 6px; top: 6px; background: #e91916; }
  .viewers { left: 6px; bottom: 6px; }
  .panel { position: relative; width: 640px; height: 120px; margin: 12px; }
  .panel .error { padding: 8px; }
  .panel .interstitial { position: absolute; inset: 0; background: #fff; padding: 8px; }
  .join { position: fixed; bottom: 0; left: 0; right: 0; background: #9147ff; color: #fff; padding: 6px 12px; }
</style>
<div class="top">
  <a href="#home">Streams</a>
  <div class="search"><input type="search" aria-label="Search Input"></div>
  <div class="icons">
    <button aria-label="Prime offers">P</button>
    <button aria-label="Log In">L</button>
    <button aria-label="Sign Up">S</button>
    <button aria-label="User Menu">U</button>
  </div>
</div>
<div class="player">
  <video src="media/motion.webm" muted></video>
  <div class="art"><img src="media/badge.png" alt="Channel offline art"></div>
</div>
<div class="row">
  <div class="thumb">
    <img src="media/thumb-1.jpg" alt="Harbour at dusk, a past broadcast">
    <span class="badge duration">1:02:33</span>
  </div>
  <div class="thumb">
    <img src="media/thumb-2.jpg" alt="Radar sweep, live now">
    <span class="badge live">LIVE</span>
    <span class="badge viewers">412 viewers</span>
  </div>
</div>
<h2 style="margin: 12px">Past broadcasts</h2>
<div class="panel">
  <div class="error">An error occurred while loading this video.</div>
  <div class="interstitial">This video is for viewers 18 and over. <button>Start watching</button></div>
</div>
<p style="margin: 12px">Following 1,204 channels.</p>
<div class="join">Join the Streams community! <button>Sign up</button></div>
