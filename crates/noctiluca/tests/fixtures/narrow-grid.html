<!doctype html>

<title>Fixture Encyclopedia - Glow</title>
<!-- Written for Noctiluca's corpus, reduced from Wikipedia's header: a CSS
     grid of three items (the logo, the search, the account links), the
     last pushed to the right edge. The terminal adaptation that snaps a
     grid gives each item an equal width, which narrows the last one. -->
<style>
  body { font: 14px sans-serif; margin: 0; }
  header { display: grid; grid-template-columns: 160px 1fr 600px; gap: 8px; padding: 8px; }
  .search input { width: 200px; }
  .links { display: flex; justify-content: flex-end; gap: 12px; }
  .links a { white-space: nowrap; }
</style>
<header>
  <div class="logo"><b>Fixture Encyclopedia</b></div>
  <div class="search"><a href="#">Search</a></div>
  <nav class="links"><a href="#">Donate</a><a href="#">Create account</a><a href="#">Log in</a></nav>
</header>
<main>
  <h1>Glow</h1>
  <p>Sea sparkle is the light some plankton give off when the water moves.</p>
</main>
