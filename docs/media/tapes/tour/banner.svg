<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882.8 655.4" font-family="Fira Code, DejaVu Sans Mono, Menlo, monospace" font-size="16">
<rect width="100%" height="100%" rx="9" fill="#292929" stroke="#464646"/>
<path d="M0 9a9 9 0 0 1 9-9h864.8a9 9 0 0 1 9 9v26h-882.8z" fill="#1e1e1e"/>
<circle cx="19" cy="17.5" r="6" fill="#ff5f56"/>
<circle cx="41" cy="17.5" r="6" fill="#ffbd2e"/>
<circle cx="63" cy="17.5" r="6" fill="#27c93f"/>
<text x="441.4" y="22.5" fill="#969696" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">rich --demo · the guided tour</text>
<text x="19.0" y="69.6" fill="#fdfdc5" font-weight="bold" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="19.0" y="90.4" fill="#00823d" textLength="345.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">─────────────────────────────────── </text>
<text x="364.6" y="90.4" fill="#c5c8c6" textLength="144.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Ask in a script</text>
<text x="508.6" y="90.4" fill="#00823d" textLength="355.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ────────────────────────────────────</text>
<text x="19.0" y="111.2" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ fruit=$(rich choose apple banana cherry)   # ↓ then Enter                             </text>
<text x="19.0" y="132.0" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╭──────────────────── drawn headless: the keys a user would press ─────────────────────╮</text>
<text x="19.0" y="152.8" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ ? Pick a fruit ›                                                                     │</text>
<text x="19.0" y="173.6" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│   apple                                                                              │</text>
<text x="19.0" y="194.4" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│ ❯ banana                                                                             │</text>
<text x="19.0" y="215.2" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│   cherry                                                                             │</text>
<text x="19.0" y="236.0" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│   3/3 · ↑↓ move · enter pick · esc cancel                                            │</text>
<text x="19.0" y="256.8" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────────╯</text>
<text x="19.0" y="277.6" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ echo "$fruit"                                                                         </text>
<text x="19.0" y="298.4" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">banana                                                                                  </text>
<text x="19.0" y="319.2" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ ls | rich filter --value toml    # without a terminal: a fuzzy grep                   </text>
<text x="19.0" y="340.0" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ rich confirm 'Deploy?' &amp;&amp; deploy  # exit 0 for yes, 1 for no                          </text>
<text x="19.0" y="360.8" fill="#00823d" textLength="249.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">───────────────────────── </text>
<text x="268.6" y="360.8" fill="#c5c8c6" textLength="345.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Pager, input and confidence controls</text>
<text x="614.2" y="360.8" fill="#00823d" textLength="249.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ─────────────────────────</text>
<text x="19.0" y="381.6" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">--auto-pager opens a pager for tall TTY output; --no-pager opts out.                    </text>
<text x="19.0" y="402.4" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">URL fetch, encoding, sanitization and JSON reports support scripts and CI.              </text>
<text x="19.0" y="423.2" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">The tour stays offline and does not open an external pager.                             </text>
<text x="19.0" y="444.0" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">$ rich --print --sanitize '&lt;ESC&gt;[31m visible controls'                                  </text>
<text x="19.0" y="464.8" fill="#c5c8c6" textLength="9.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">␛</text>
<text x="28.6" y="464.8" fill="#c5c8c6" font-weight="bold" textLength="9.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[</text>
<text x="38.2" y="464.8" fill="#398280" font-weight="bold" textLength="19.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">31</text>
<text x="57.4" y="464.8" fill="#c5c8c6" textLength="806.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">m visible controls                                                                  </text>
<text x="19.0" y="485.6" fill="#00823d" textLength="355.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">──────────────────────────────────── </text>
<text x="374.2" y="485.6" fill="#c5c8c6" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">FIGlet banners</text>
<text x="508.6" y="485.6" fill="#00823d" textLength="355.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ────────────────────────────────────</text>
<text x="19.0" y="506.4" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ____  ___ ____ _   _                                                                   </text>
<text x="19.0" y="527.2" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|  _ \|_ _/ ___| | | |                                                                  </text>
<text x="19.0" y="548.0" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">| |_) || | |   | |_| |                                                                  </text>
<text x="19.0" y="568.8" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|  _ &lt; | | |___|  _  |                                                                  </text>
<text x="19.0" y="589.6" fill="#c5c8c6" textLength="844.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|_| \_\___\____|_| |_|                                                                  </text>
<rect x="19.0" y="615.6" width="9.6" height="20.8" fill="#c5c8c6" opacity="0.7"/>
