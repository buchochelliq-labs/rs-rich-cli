<span style="color: #777877; text-decoration-color: #777877">GREET(1)                                   User Commands                                    GREET(1)</span>
                                                                                                    
<span style="color: #98729f; text-decoration-color: #98729f; text-decoration: underline">NAME</span>                                                                                                
                                                                                                    
greet - print a friendly greeting                                                                   
                                                                                                    
<span style="color: #98729f; text-decoration-color: #98729f; text-decoration: underline">SYNOPSIS</span>                                                                                            
                                                                                                    
<span style="font-weight: bold">greet </span>[<span style="font-weight: bold">-n </span><span style="font-style: italic">count</span>] [<span style="font-weight: bold">--shout</span>] <span style="font-style: italic">name</span>...                                                                  
                                                                                                    
<span style="color: #98729f; text-decoration-color: #98729f; text-decoration: underline">DESCRIPTION</span>                                                                                         
                                                                                                    
<span style="font-weight: bold">greet </span>writes a greeting for each <span style="font-style: italic">name </span>to standard output. The greeting is “Hello” unless <span style="font-weight: bold">--shout </span>   
says otherwise — then it is louder.                                                                 
                                                                                                    
<span style="color: #ff2c7a; text-decoration-color: #ff2c7a; font-weight: bold">Options</span>                                                                                             
                                                                                                    
<span style="font-weight: bold">-n, --count=</span><span style="font-weight: bold; font-style: italic">N</span>                                                                                       
    Repeat each greeting <span style="font-style: italic">N </span>times.                                                                   
                                                                                                    
<span style="font-weight: bold">-s, --shout</span>                                                                                         
    Write the greeting in capitals.                                                                 
                                                                                                    
        <span style="font-weight: bold"> • </span>Works with every name.                                                                   
        <span style="font-weight: bold"> • </span>Ignores the locale.                                                                      
                                                                                                    
<span style="color: #98729f; text-decoration-color: #98729f; text-decoration: underline">EXAMPLES</span>                                                                                            
                                                                                                    
<span style="background-color: #2b303b">                                                                                                    </span>
<span style="background-color: #2b303b"> </span><span style="color: #c0c5ce; text-decoration-color: #c0c5ce; background-color: #2b303b">$ greet -n 2 world</span><span style="background-color: #2b303b">                                                                                 </span>
<span style="background-color: #2b303b"> </span><span style="color: #c0c5ce; text-decoration-color: #c0c5ce; background-color: #2b303b">Hello, world</span><span style="background-color: #2b303b">                                                                                       </span>
<span style="background-color: #2b303b"> </span><span style="color: #c0c5ce; text-decoration-color: #c0c5ce; background-color: #2b303b">Hello, world</span><span style="background-color: #2b303b">                                                                                       </span>
<span style="background-color: #2b303b">                                                                                                    </span>

..                                                                  ","\u003cspan style=\"color: #98729f; text-decoration-color: #98729f; text-decoration: underline\">DESCRIPTION\u003c/span>                                                                                         ","\u003cspan style=\"font-weight: bold\">greet \u003c/span>writes a greeting for each \u003cspan style=\"font-style: italic\">name \u003c/span>to standard output. The greeting is “Hello” unless \u003cspan style=\"font-weight: bold\">--shout \u003c/span>   ","says otherwise — then it is louder.                                                                 ","\u003cspan style=\"color: #ff2c7a; text-decoration-color: #ff2c7a; font-weight: bold\">Options\u003c/span>                                                                                             ","\u003cspan style=\"font-weight: bold\">-n, --count=\u003c/span>\u003cspan style=\"font-weight: bold; font-style: italic\">N\u003c/span>                                                                                       ","    Repeat each greeting \u003cspan style=\"font-style: italic\">N \u003c/span>times.                                                                   ","\u003cspan style=\"font-weight: bold\">-s, --shout\u003c/span>                                                                                         ","    Write the greeting in capitals.                                                                 ","        \u003cspan style=\"font-weight: bold\"> • \u003c/span>Works with every name.                                                                   ","        \u003cspan style=\"font-weight: bold\"> • \u003c/span>Ignores the locale.                                                                      ","\u003cspan style=\"color: #98729f; text-decoration-color: #98729f; text-decoration: underline\">EXAMPLES\u003c/span>                                                                                            ","
