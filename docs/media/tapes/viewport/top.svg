<text x="383.8" y="22.5" fill="#969696" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">rich_interact::Viewport · the example pager</text>
<text x="316.6" y="69.6" fill="#c5c8c6" font-weight="bold" text-decoration="underline" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rs-rich-record</text>
<text x="19.0" y="111.2" fill="#c5c8c6" textLength="336.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Record scripted terminal sessions (</text>
<text x="355.0" y="111.2" fill="#c5c8c6" font-weight="bold" textLength="48.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">tapes</text>
<text x="403.0" y="111.2" fill="#c5c8c6" textLength="345.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">) into screenshots, asciinema casts,</text>
<text x="19.0" y="132.0" fill="#c5c8c6" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">GIF and MP4. Part of </text>
<text x="220.6" y="132.0" fill="#608ab1" text-decoration="underline" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rs-rich</text>
<text x="287.8" y="132.0" fill="#c5c8c6" textLength="268.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">, the Rust port of Python's </text>
<rect x="556.6" y="116.4" width="38.4" height="20.8" fill="#4b4e55"/>
<text x="556.6" y="132.0" fill="#398280" font-weight="bold" textLength="38.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rich</text>
<text x="595.0" y="132.0" fill="#c5c8c6" textLength="153.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">. This crate is </text>
<text x="19.0" y="152.8" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">an rs-rich addition, not a port.                                            </text>
<text x="19.0" y="194.4" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A tape scripts a session, one step per line:                                </text>
<rect x="19.0" y="220.4" width="729.6" height="20.8" fill="#2b303b"/>
<rect x="19.0" y="241.2" width="9.6" height="20.8" fill="#2b303b"/>
<rect x="28.6" y="241.2" width="134.4" height="20.8" fill="#2b303b"/>
<text x="28.6" y="256.8" fill="#c0c5ce" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Set Size 90x22</text>
