<text x="28.6" y="298.4" fill="#c0c5ce" textLength="345.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Write service.json '{"replicas": 2}'</text>
<rect x="374.2" y="282.8" width="374.4" height="20.8" fill="#2b303b"/>
<rect x="19.0" y="303.6" width="9.6" height="20.8" fill="#2b303b"/>
