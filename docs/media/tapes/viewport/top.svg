<rect x="28.6" y="262.0" width="422.4" height="20.8" fill="#2b303b"/>
<text x="28.6" y="277.6" fill="#c0c5ce" textLength="422.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Set Title "rich --watch · re-render on save"</text>
<rect x="451.0" y="262.0" width="297.6" height="20.8" fill="#2b303b"/>
<rect x="19.0" y="282.8" width="9.6" height="20.8" fill="#2b303b"/>
