<path d="M0 9a9 9 0 0 1 9-9h749.6a9 9 0 0 1 9 9v26h-767.6z" fill="#1e1e1e"/>
<circle cx="19" cy="17.5" r="6" fill="#ff5f56"/>
<circle cx="41" cy="17.5" r="6" fill="#ffbd2e"/>
<circle cx="63" cy="17.5" r="6" fill="#27c93f"/>
<text x="383.8" y="22.5" fill="#969696" font-family="DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">rich_interact::Viewport · the example pager</text>
<text x="355.0" y="69.6" fill="#c5c8c6" font-weight="bold" text-decoration="underline" textLength="48.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">orbit</text>
<text x="19.0" y="111.2" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A tiny service, here so the documentation's recordings have something to    </text>
<text x="19.0" y="132.0" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">page through, pick from and search. Nothing in it runs.                     </text>
<text x="19.0" y="173.6" fill="#98729f" text-decoration="underline" textLength="115.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">What it does</text>
<text x="19.0" y="215.2" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">orbit watches a queue, hands each job to a worker and reports progress in   </text>
<text x="19.0" y="236.0" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the terminal. Workers are plain functions; the scheduler decides how many   </text>
<text x="19.0" y="256.8" fill="#c5c8c6" textLength="729.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">run at once, retries a job that fails, and gives up after three tries.      </text>
<text x="19.0" y="298.4" fill="#98729f" text-decoration="underline" textLength="124.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Configuration</text>
<text x="19.0" y="360.8" fill="#68a0b3" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Setting</text>
<text x="105.4" y="360.8" fill="#68a0b3" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Default</text>
<text x="191.8" y="360.8" fill="#68a0b3" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Meaning</text>
<text x="19.0" y="381.6" fill="#68a0b3" textLength="470.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ─────────────────────────────────────────────── </text>
<rect x="28.6" y="386.8" width="67.2" height="20.8" fill="#4b4e55"/>
<text x="28.6" y="402.4" fill="#398280" font-weight="bold" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">workers</text>
<text x="115.0" y="402.4" fill="#c5c8c6" textLength="76.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">4       </text>
<text x="201.4" y="402.4" fill="#c5c8c6" textLength="278.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Jobs that run at once        </text>
<text x="19.0" y="423.2" fill="#777877" textLength="393.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">lines 1–17 of 52 · ↑↓ PgUp PgDn · q quits</text>
