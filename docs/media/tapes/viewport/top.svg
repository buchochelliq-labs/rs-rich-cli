<rect x="19.0" y="345.2" width="9.6" height="20.8" fill="#2b303b"/>
<rect x="28.6" y="345.2" width="192.0" height="20.8" fill="#2b303b"/>
<text x="28.6" y="360.8" fill="#c0c5ce" textLength="192.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Wait /"replicas": 2/</text>
