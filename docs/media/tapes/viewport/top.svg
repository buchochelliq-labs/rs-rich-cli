<text x="28.6" y="319.2" fill="#c0c5ce" textLength="307.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Type "rich --watch service.json"</text>
<rect x="335.8" y="303.6" width="412.8" height="20.8" fill="#2b303b"/>
<rect x="19.0" y="324.4" width="9.6" height="20.8" fill="#2b303b"/>
