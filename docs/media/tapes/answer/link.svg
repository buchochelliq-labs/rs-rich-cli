    <text class="rich-record-r2" x="329.4" y="20" textLength="207.4" clip-path="url(#rich-record-line-0)">Moving&#160;the&#160;config</text><text class="rich-record-r1" x="878.4" y="20" textLength="12.2" clip-path="url(#rich-record-line-0)">
</text><text class="rich-record-r1" x="878.4" y="44.4" textLength="12.2" clip-path="url(#rich-record-line-1)">
</text><text class="rich-record-r1" x="0" y="68.8" textLength="878.4" clip-path="url(#rich-record-line-2)">Three&#160;steps,&#160;in&#160;order:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="rich-record-r1" x="878.4" y="68.8" textLength="12.2" clip-path="url(#rich-record-line-2)">
</text><text class="rich-record-r1" x="878.4" y="93.2" textLength="12.2" clip-path="url(#rich-record-line-3)">
</text><text class="rich-record-r1" x="878.4" y="117.6" textLength="12.2" clip-path="url(#rich-record-line-4)">
</text><text class="rich-record-r3" x="0" y="142" textLength="36.6" clip-path="url(#rich-record-line-5)">&#160;1&#160;</text><text class="rich-record-r1" x="36.6" y="142" textLength="280.6" clip-path="url(#rich-record-line-5)">Read&#160;the&#160;old&#160;file&#160;from&#160;</text><text class="rich-record-r4" x="317.2" y="142" textLength="134.2" clip-path="url(#rich-record-line-5)">~/.app.toml</text><text class="rich-record-r1" x="451.4" y="142" textLength="427" clip-path="url(#rich-record-line-5)">.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="rich-record-r1" x="878.4" y="142" textLength="12.2" clip-path="url(#rich-record-line-5)">
</text><text class="rich-record-r1" x="36.6" y="166.4" textLength="841.8" clip-path="url(#rich-record-line-6)">Keep&#160;its&#160;comments:&#160;the&#160;new&#160;reader&#160;keeps&#160;them&#160;too.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="rich-record-r1" x="878.4" y="166.4" textLength="12.2" clip-path="url(#rich-record-line-6)">
</text><text class="rich-record-r3" x="0" y="190.8" textLength="36.6" clip-path="url(#rich-record-line-7)">&#160;2&#160;</text><text class="rich-record-r1" x="36.6" y="190.8" textLength="841.8" clip-path="url(#rich-record-line-7)">Write&#160;it&#160;to&#160;the&#160;new&#160;place.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="rich-record-r1" x="878.4" y="190.8" textLength="12.2" clip-path="url(#rich-record-line-7)">
