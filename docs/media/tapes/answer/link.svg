</text><text class="rich-record-r1" x="878.4" y="239.6" textLength="12.2" clip-path="url(#rich-record-line-9)">
</text><text class="rich-record-r1" x="0" y="264" textLength="244" clip-path="url(#rich-record-line-10)">The&#160;new&#160;place&#160;is&#160;in&#160;</text><text class="rich-record-r5" x="244" y="264" textLength="195.2" clip-path="url(#rich-record-line-10)">the&#160;config&#160;guide</text><text class="rich-record-r1" x="439.2" y="264" textLength="439.2" clip-path="url(#rich-record-line-10)">.&#160;In&#160;code:&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="rich-record-r1" x="878.4" y="264" textLength="12.2" clip-path="url(#rich-record-line-10)">
