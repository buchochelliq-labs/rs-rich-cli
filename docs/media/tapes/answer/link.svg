</text><text class="rich-record-r6" x="12.2" y="337.2" textLength="36.6" clip-path="url(#rich-record-line-13)">let</text><text class="rich-record-r7" x="48.8" y="337.2" textLength="85.4" clip-path="url(#rich-record-line-13)">&#160;old&#160;=&#160;</text><text class="rich-record-r8" x="134.2" y="337.2" textLength="48.8" clip-path="url(#rich-record-line-13)">read</text><text class="rich-record-r7" x="183" y="337.2" textLength="24.4" clip-path="url(#rich-record-line-13)">(&quot;</text><text class="rich-record-r9" x="207.4" y="337.2" textLength="134.2" clip-path="url(#rich-record-line-13)">~/.app.toml</text><text class="rich-record-r7" x="341.6" y="337.2" textLength="48.8" clip-path="url(#rich-record-line-13)">&quot;)?;</text><text class="rich-record-r1" x="878.4" y="337.2" textLength="12.2" clip-path="url(#rich-record-line-13)">
</text><text class="rich-record-r8" x="12.2" y="361.6" textLength="61" clip-path="url(#rich-record-line-14)">write</text><text class="rich-record-r7" x="73.2" y="361.6" textLength="12.2" clip-path="url(#rich-record-line-14)">(</text><text class="rich-record-r8" x="85.4" y="361.6" textLength="122" clip-path="url(#rich-record-line-14)">config_dir</text><text class="rich-record-r7" x="207.4" y="361.6" textLength="36.6" clip-path="url(#rich-record-line-14)">().</text><text class="rich-record-r8" x="244" y="361.6" textLength="48.8" clip-path="url(#rich-record-line-14)">join</text><text class="rich-record-r7" x="292.8" y="361.6" textLength="24.4" clip-path="url(#rich-record-line-14)">(&quot;</text><text class="rich-record-r9" x="317.2" y="361.6" textLength="97.6" clip-path="url(#rich-record-line-14)">app.toml</text><text class="rich-record-r7" x="414.8" y="361.6" textLength="122" clip-path="url(#rich-record-line-14)">&quot;),&#160;old)?;</text><text class="rich-record-r1" x="878.4" y="361.6" textLength="12.2" clip-path="url(#rich-record-line-14)">
