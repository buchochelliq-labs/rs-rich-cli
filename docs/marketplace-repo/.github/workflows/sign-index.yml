# Rebuild and sign the marketplace index.
#
# This workflow belongs to the rs-rich-marketplace repository; rs-rich-cli
# keeps it in docs/marketplace-repo/ to hand over (see the README there).
# The contract is rs-rich-cli's docs/design/marketplace.md, "Signing".
#
# On every merge to main that touches packages/ (a listing pull request), on
# a weekly schedule (an index expires after 30 days, so it is re-signed well
# before), and by hand: the listings are validated, index.json is rebuilt
# with the serial bumped, signed with the main key and committed to main
# with its signature.
#
# The main key's secret half and its password are secrets of the protected
# `marketplace-signing` environment: it runs only from main, and only after
# a required reviewer (the maintainer) approves the run. The backup key
# never enters GitHub.
#
# The signed index is pushed to main with a short-lived installation token
# of the signer's GitHub App, which main's ruleset lets bypass it. The App's
# client id (the environment variable SIGNER_APP_CLIENT_ID) and private key
# (the environment secret SIGNER_APP_PRIVATE_KEY) live in the same
# environment; the App has one repository permission, Contents: read and
# write, and is installed on this repository only. The token is asked for
# with contents: write on this repository alone, expires within the hour and
# is revoked when the job ends; the workflow's own token only reads. The
# commit is authored by the App's bot user, `<app-slug>[bot]`.
#
# A push with an App's token starts workflows, unlike one with
# GITHUB_TOKEN, but the signer's commit changes only index.json and
# index.json.minisig: this workflow's push trigger is limited to
# packages/** and keys/**, and check-listings.yml runs on pull requests
# only, so the commit starts neither.
name: Sign the index

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "keys/**"
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# One signing at a time, so two runs never take the same serial.
concurrency:
  group: marketplace-signing
  cancel-in-progress: false

permissions:
  contents: read

# Supply chain: every action is pinned to a full commit SHA (the tag it was
# taken from in the comment), the Python packages are installed only from
# .github/requirements-signer.txt, whose every file is pinned by SHA-256,
# and rs-rich-cli's validator is fetched at a fixed commit, not a branch.
# Moving any of them is a reviewed change to this repository.
env:
  # The rs-rich-cli revision whose validator and schemas apply: the commit
  # of rs-rich-cli's release-0.0.23 tag, unless the repository variable
  # names another. Set the variable to the release the marketplace serves
  # (a tag, or better its commit), and move it with that release; this
  # default moves only by a change to this file, never by a push to
  # rs-rich-cli's main.
  RS_RICH_CLI_REF: ${{ vars.RS_RICH_CLI_REF || '2624ce5b5d76c092a59033d61ae7db3b50b8c8e9' }}

jobs:
  validate:
    name: listings validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch rs-rich-cli's validator and schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buchochelliq-labs/rs-rich-cli
          ref: ${{ env.RS_RICH_CLI_REF }}
          path: .rs-rich-cli
          sparse-checkout: |
            scripts/validate_marketplace.py
            schemas/marketplace
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Every listing is valid
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r .github/requirements-signer.txt
          python3 .rs-rich-cli/scripts/validate_marketplace.py --jsonschema require packages/*.json

  sign:
    name: rebuild and sign index.json
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: marketplace-signing
    permissions:
      contents: read
    steps:
      # Before anything is minted or checked out: every secret and variable
      # the job needs is there, so a half-set-up environment fails here,
      # naming what is missing, and not in the token action or at the push.
      # Only whether each is set is read, never its value.
      - name: The marketplace-signing environment is set up
        env:
          HAS_MINISIGN_KEY: ${{ secrets.MARKETPLACE_MINISIGN_KEY != '' }}
          HAS_MINISIGN_PASSWORD: ${{ secrets.MARKETPLACE_MINISIGN_PASSWORD != '' }}
          HAS_APP_CLIENT_ID: ${{ vars.SIGNER_APP_CLIENT_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.SIGNER_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_MINISIGN_KEY" = "true" ] || missing="$missing secret:MARKETPLACE_MINISIGN_KEY"
          [ "$HAS_MINISIGN_PASSWORD" = "true" ] || missing="$missing secret:MARKETPLACE_MINISIGN_PASSWORD"
          [ "$HAS_APP_CLIENT_ID" = "true" ] || missing="$missing variable:SIGNER_APP_CLIENT_ID"
          [ "$HAS_APP_PRIVATE_KEY" = "true" ] || missing="$missing secret:SIGNER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::the marketplace-signing environment has no$missing (see the marketplace README, \"Installing it\", steps 3 and 4)"
            exit 1
          fi

      # The signer App's installation token, not the workflow's, pushes the
      # signed index: main's ruleset lets the App bypass it. It is asked for
      # with contents: write on this repository only, whatever else the
      # App might be granted, and is revoked when the job ends.
      - name: Mint the signer App's token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIGNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIGNER_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Checked out with the App's token, which is not left in .git/config
      # (persist-credentials: false): the steps between here and the push
      # run Python from this repository and from rs-rich-cli, and none of
      # them needs to write. The push step hands git the token itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Fetch rs-rich-cli's validator and schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buchochelliq-labs/rs-rich-cli
          ref: ${{ env.RS_RICH_CLI_REF }}
          path: .rs-rich-cli
          sparse-checkout: |
            scripts/validate_marketplace.py
            schemas/marketplace
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install minisign and jsonschema
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -m pip install --require-hashes --only-binary=:all: --no-deps \
            -r .github/requirements-signer.txt

      - name: Rebuild index.json with the next serial
        id: index
        run: |
          serial="$(python3 scripts/build_index.py)"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          python3 .rs-rich-cli/scripts/validate_marketplace.py --jsonschema require --index index.json

      - name: Sign it with the main key
        env:
          MINISIGN_KEY: ${{ secrets.MARKETPLACE_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MARKETPLACE_MINISIGN_PASSWORD }}
          SERIAL: ${{ steps.index.outputs.serial }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/main.key"
          trap 'rm -f "$key"' EXIT
          # A secret pasted on Windows keeps its CRs, and a paste can drop the
          # comment line or add blank ones: write the key minisign expects, an
          # "untrusted comment:" line and the base64 line, from either shape.
          # Only facts about its shape are printed, never the key.
          python3 - "$key" <<'PY'
          import os, re, sys
          lines = [l.strip() for l in os.environ["MINISIGN_KEY"].replace("\r", "").split("\n")]
          lines = [l for l in lines if l]
          comment = next((l for l in lines if l.startswith("untrusted comment:")), None)
          body = [l for l in lines if not l.startswith("untrusted comment:")]
          shape = (f"{len(lines)} non-empty line(s), comment line "
                   f"{'present' if comment else 'missing'}, "
                   f"{len(body)} key line(s) of {[len(l) for l in body]} characters")
          # A secret key line is 212 characters (158 bytes); a public key's is 56.
          if len(body) != 1 or len(body[0]) != 212 or not re.fullmatch(r"[A-Za-z0-9+/]+={0,2}", body[0]):
              print(f"::error::MARKETPLACE_MINISIGN_KEY is not a minisign secret key: {shape}. "
                    "Paste the whole of main.key (two lines: the untrusted comment, "
                    "then one long base64 line), not main.pub.")
              sys.exit(1)
          print(f"secret key shape: {shape}")
          with open(sys.argv[1], "w", encoding="ascii") as f:
              f.write((comment or "untrusted comment: minisign secret key") + "\n" + body[0] + "\n")
          PY
          # minisign reads the password from standard input when it is not
          # a terminal; a pasted CR would be part of it.
          printf '%s\n' "${MINISIGN_PASSWORD%$'\r'}" | minisign -S -s "$key" -m index.json \
            -x index.json.minisig -t "rs-rich-marketplace index serial=$SERIAL"

      - name: The signature verifies with the newest published main key
        env:
          SERIAL: ${{ steps.index.outputs.serial }}
        run: |
          set -euo pipefail
          public="$(python3 - <<'EOF'
          import json, pathlib, re
          files = sorted(pathlib.Path("keys").glob("keys-*.json"),
                         key=lambda p: int(re.search(r"(\d+)", p.name).group(1)))
          print(json.loads(files[-1].read_text())["main"]["public_key"])
          EOF
          )"
          minisign -V -P "$public" -m index.json -x index.json.minisig | tee verify.log
          grep -qx "Trusted comment: rs-rich-marketplace index serial=$SERIAL" verify.log
          rm verify.log

      # The commit is the App's bot user's: `<app-slug>[bot]`, with the
      # noreply address GitHub gives it, `<user id>+<app-slug>[bot]@...`.
      # The slug comes from the token action; the bot user's id is public,
      # read from the users API with the App's token.
      - name: Commit the signed index to main
        env:
          SERIAL: ${{ steps.index.outputs.serial }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          case "$bot_id" in
            ''|*[!0-9]*) echo "::error::no user id for the signer App's bot user $bot"; exit 1 ;;
          esac
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git add index.json index.json.minisig
          git commit -m "Sign the index, serial $SERIAL"
          # The token goes to this one command as an HTTP header, as
          # actions/checkout would have set it, and is never written to disk.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:main
