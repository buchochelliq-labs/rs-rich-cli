# A service's configuration, for the `rich explore` tape.
name: storefront
version: 2.4.1
server:
  host: 0.0.0.0
  port: 8080
  tls:
    enabled: true
    certificate: /etc/storefront/cert.pem
database:
  url: postgres://db.internal:5432/shop
  pool: 16
users:
  - name: ada
    roles: [admin, deploy]
  - name: grace
    roles: [deploy]
features:
  search: true
  recommendations: false
