# Breaking changes accepted for the release in preparation, per crate and per
# the version that ships them. scripts/semver_check.py (CI's `public API and
# SemVer` job) checks every 0.0.x crate against its last release as if the
# bump were a minor one, and fails on a breaking change not listed here.
#
# An entry names the cargo-semver-checks lint, the items as its report names
# them (without their file locations), and why; `items = ["*"]` takes every
# item of the lint. Once the version is on crates.io the entries are spent:
# the script says so, and they are removed.

[[break]]
crate = "noctiluca"
version = "0.0.4"
lint = "constructible_struct_adds_field"
items = ["field Media.revision", "field Media.text"]
why = "live regions (0.0.25 plan, Noctiluca real sites fixes 1 and 6): an inline svg's content revision keys its still, and its <text> is read as its text"

[[break]]
crate = "noctiluca"
version = "0.0.4"
lint = "constructible_struct_adds_field"
items = ["field Run.twin", "field Control.glyph", "field Control.hover_only", "field Media.pending", "field Page.indicators"]
why = "page semantics (0.0.25 plan, Noctiluca real sites fixes 3, 7, 8, 9, 13, 16): screen-reader twins, icon buttons' glyphs, hover-only controls, lazy thumbnails' placeholders, and meters, progress bars and ratings as indicators"

