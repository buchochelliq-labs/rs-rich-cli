# Breaking changes accepted for the release in preparation, per crate and per
# the version that ships them. scripts/semver_check.py (CI's `public API and
# SemVer` job) checks every 0.0.x crate against its last release as if the
# bump were a minor one, and fails on a breaking change not listed here.
#
# An entry names the cargo-semver-checks lint, the items as its report names
# them (without their file locations), and why; `items = ["*"]` takes every
# item of the lint. Once the version is on crates.io the entries are spent:
# the script says so, and they are removed.

[[break]]
crate = "rs-rich-embed"
version = "0.0.10"
lint = "constructible_struct_adds_field"
items = ["field PageState.crashed"]
why = "A page whose renderer crashed is told apart from one that loads (0.0.27's \"the browser has gone\" fixes, B3): ChromeEngine sets it on Inspector.targetCrashed. A struct literal adds it or uses ..Default::default()"

[[break]]
crate = "noctiluca"
version = "0.0.6"
lint = "constructible_struct_adds_field"
items = ["field Playback.live", "field Playback.empty"]
why = "#889: the media keys never pick an element with nothing to play (`empty`), and a length not known yet is told from a live stream's (`live`). A struct literal adds them or uses ..Default::default()"

[[break]]
crate = "noctiluca"
version = "0.0.6"
lint = "enum_variant_added"
items = ["variant Rule:BadgeText"]
why = "Chat badges as text are made a rule of their own (`badge-text`, on by default), so they can be drawn as pictures again. An exhaustive match over Rule handles the new variant"
