# Breaking changes accepted for the release in preparation, per crate and per
# the version that ships them. scripts/semver_check.py (CI's `public API and
# SemVer` job) checks every 0.0.x crate against its last release as if the
# bump were a minor one, and fails on a breaking change not listed here.
#
# An entry names the cargo-semver-checks lint, the items as its report names
# them (without their file locations), and why; `items = ["*"]` takes every
# item of the lint. Once the version is on crates.io the entries are spent:
# the script says so, and they are removed.

[[break]]
crate = "noctiluca"
version = "0.0.3"
lint = "constructible_struct_adds_field"
items = ["field Args.no_mouse"]
why = "the mouse in Noctiluca adds --no-mouse, which leaves the mouse to the terminal (0.0.24 plan)"

[[break]]
crate = "noctiluca"
version = "0.0.3"
lint = "enum_struct_variant_field_added"
items = ["field scale of variant Command::Regions"]
why = "video at up to 30 fps asks Chrome for a screencast scaled to the regions' needs (0.0.24 plan)"

[[break]]
crate = "noctiluca"
version = "0.0.3"
lint = "constructible_struct_adds_field"
items = ["field Args.transparent", "field ChromeOptions.transparent", "field Config.transparent"]
why = "--transparent lets the terminal's background show where a page sets none (#821, 0.0.24 plan)"

[[break]]
crate = "noctiluca"
version = "0.0.3"
lint = "constructible_struct_adds_field"
items = ["field Page.background"]
why = "the model reads the page's own background colour, which --transparent keeps (#821, 0.0.24 plan)"

[[break]]
