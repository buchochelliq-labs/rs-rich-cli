# Breaking changes accepted for the release in preparation, per crate and per
# the version that ships them. scripts/semver_check.py (CI's `public API and
# SemVer` job) checks every 0.0.x crate against its last release as if the
# bump were a minor one, and fails on a breaking change not listed here.
#
# An entry names the cargo-semver-checks lint, the items as its report names
# them (without their file locations), and why; `items = ["*"]` takes every
# item of the lint. Once the version is on crates.io the entries are spent:
# the script says so, and they are removed.

# Documentation-only breaks not represented by a cargo-semver-checks lint.
# These are not lint allowances: known_breaks() reads only [[break]]. The
# exact public API snapshots and CHANGELOG migration note expose this change.
# A 0.0.x patch is already Cargo-incompatible with the version before it.
[[manual_break]]
crate = "rs-rich-ext"
version = "0.0.23"
item = "rich_ext::surface::Cell::width"
from = "u8"
to = "u16"
reason = "Caller-measured atoms may occupy more than 255 columns; migrate width variables/conversions to u16. Cell::new retains its u8 argument."

[[manual_break]]
crate = "rs-rich-intuituive"
version = "0.0.11"
item = "intuituive::screen::Cell::width"
from = "u8"
to = "u16"
reason = "The re-exported surface Cell width widens; migrate width variables/conversions to u16."

[[manual_break]]
crate = "noctiluca"
version = "0.0.5"
item = "noctiluca::args::Args::mute"
from = "no field"
to = "pub mute: bool"
reason = "`--mute`/`--no-audio` now that sound is on by default when not over SSH; a struct literal of Args adds `mute: false` (or uses ..Args::default())."

[[manual_break]]
crate = "noctiluca"
version = "0.0.5"
item = "noctiluca::testing::FakeState::screencast_area, noctiluca::testing::FakeState::screencast_areas"
from = "no fields"
to = "pub screencast_area: Option<Rect>, pub screencast_areas: Vec<Option<Rect>>"
reason = "The fake engine records the screencast area the tab asks for (Engine::set_screencast_area); a struct literal of FakeState adds them (or uses ..FakeState::default())."
