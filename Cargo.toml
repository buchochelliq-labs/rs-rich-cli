[workspace]
resolver = "2"
members = ["crates/rich", "crates/rich-ext", "crates/rich-cli", "crates/rich-art"]

# Shared metadata. NOTE: `version` is intentionally NOT shared here — each crate
# carries its own version because `rich` and `rich-cli` mirror *different*
# upstream projects (see AGENTS.md → Versioning).
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/buchochelliq-labs/rs-rich-cli"
authors = ["rs-rich-cli contributors"]
# The true floor of the dependency tree, enforced by the `msrv` CI job. Driven
# by syntect -> plist/time (1.88); the network/image deps sit below it. Verify
# with `cargo +1.88.0 check --workspace --all-features` before lowering.
rust-version = "1.88"

[workspace.dependencies]
# Internal crates
rich = { path = "crates/rich", version = "15.0.0" }
rich-ext = { path = "crates/rich-ext", version = "0.1.0" }
rich-art = { path = "crates/rich-art", version = "0.1.0" }

# Third-party (kept lean for the first slice)
unicode-width = "0.2"
terminal_size = "0.4"
# preserve_order keeps object keys in input order, matching Python's json module.
serde_json = { version = "1", features = ["preserve_order"] }
# fancy-regex supports the lookbehind/backreference features rich's ReprHighlighter uses.
fancy-regex = "0.18"
# CommonMark parser for the Markdown renderable.
pulldown-cmark = { version = "0.12", default-features = false }
# Syntax highlighting engine (Pygments-equivalent). `default-fancy` uses the
# pure-Rust fancy-regex backend, avoiding the C `onig` dependency.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Image decoding for rich-art's optional image->ASCII art (jp2a-style). Only the
# PNG/JPEG decoders are enabled, keeping the tree small; behind rich-art's
# NON-default `image` feature so the crate is zero-dependency unless opted in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

# Blocking HTTP client for the CLI's URL fetch (rich-cli's `rich <url>`). Uses
# rustls + bundled webpki roots (self-contained TLS, no OS cert dependency).
# Behind rich-cli's default `fetch` feature so lean builds can opt out.
# (No version pin needed: ureq 3.3 wants rustc 1.85, comfortably under the
# workspace MSRV of 1.88.)
ureq = "3"

# Core stays safe by default; the future Windows-console port may opt back in
# per-item with an explicit `#[allow(unsafe_code)]` + justification.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Keep the core faithful and readable; deny sloppy stuff in CI.
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
