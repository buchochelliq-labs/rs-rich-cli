[workspace]
resolver = "2"
members = ["crates/rich", "crates/rich-plugin-api", "crates/rich-macros", "crates/rich-ext", "crates/rich-cli", "crates/rich-art", "crates/rich-mermaid", "crates/rich-lumis", "crates/rich-record", "crates/rich-interact", "crates/rich-micro", "crates/rich-diagram", "crates/rich-data", "crates/rich-ratatui", "crates/rich-intuituive", "crates/rich-web", "crates/rich-embed", "crates/rich-marketplace", "crates/noctiluca"]
# The Python bindings build with maturin and need a Python interpreter; they
# have their own workspace and CI workflow (`python.yml`).
exclude = ["crates/rich-py"]

# Shared metadata. `version` is intentionally NOT inherited: each crate owns its
# SemVer. A `vX.Y.Z` tag selects the coordinated workspace; a
# `<crate>-vX.Y.Z` tag selects only that crate (see docs/BRANCHING.md).
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/buchochelliq-labs/rs-rich-cli"
homepage = "https://github.com/buchochelliq-labs/rs-rich-cli"
authors = ["rs-rich-cli contributors"]
# The true floor of the dependency tree, enforced by the `msrv` CI job. Driven
# by the locked dependency graph, including CLI image/network features. Verify
# with `cargo +1.90.0 check --workspace --all-features` before lowering.
rust-version = "1.90"

[workspace.dependencies]
# Internal crates. The crates.io *package* names are `rs-rich-*` because plain
# `rich` is taken by an unrelated crate; the `package = …` key maps them back to
# the short names, so every `use rich::…` in this workspace is unaffected.
# External users get the same short names via each crate's `[lib] name`.
# `default-features = false`: each member asks for `syntax` / `markdown` only
# if it uses them, so `rs-rich-ext` without its defaults stays syntect-free.
rich = { package = "rs-rich", path = "crates/rich", version = "0.0.13", default-features = false }
rich-plugin-api = { package = "rs-rich-plugin-api", path = "crates/rich-plugin-api", version = "0.0.7" }
rich-macros = { package = "rs-rich-macros", path = "crates/rich-macros", version = "0.0.7" }
rich-ext = { package = "rs-rich-ext", path = "crates/rich-ext", version = "0.0.20" }
rich-art = { package = "rs-rich-art", path = "crates/rich-art", version = "0.0.16" }
rich-diagram = { package = "rs-rich-diagram", path = "crates/rich-diagram", version = "0.0.6" }
rich-mermaid = { package = "rs-rich-mermaid", path = "crates/rich-mermaid", version = "0.0.9" }
rich-lumis = { package = "rs-rich-lumis", path = "crates/rich-lumis", version = "0.0.7" }
rich-record = { package = "rs-rich-record", path = "crates/rich-record", version = "0.0.11" }
rich-interact = { package = "rs-rich-interact", path = "crates/rich-interact", version = "0.0.11" }
rich-micro = { package = "rs-rich-micro", path = "crates/rich-micro", version = "0.0.9" }
rich-data = { package = "rs-rich-data", path = "crates/rich-data", version = "0.0.7" }
rich-ratatui = { package = "rs-rich-ratatui", path = "crates/rich-ratatui", version = "0.0.8" }
rich-intuituive = { package = "rs-rich-intuituive", path = "crates/rich-intuituive", version = "0.0.8" }
rich-web = { package = "rs-rich-web", path = "crates/rich-web", version = "0.0.6" }
rich-embed = { package = "rs-rich-embed", path = "crates/rich-embed", version = "0.0.6" }
rich-marketplace = { package = "rs-rich-marketplace", path = "crates/rich-marketplace", version = "0.0.2", default-features = false }
# Cargo's default caret requirement treats 0.0.x specially: `version = "0.0.2"`
# means >=0.0.2,<0.0.3, not >=0.0.2,<0.1.0. Therefore any internal crate bump
# must also update every direct dependent's workspace requirement.

# Third-party (kept lean for the first slice)
terminal_size = "0.4"
# rich's per-cell strings (`Segment.text`, `Color.name`): inline up to 24
# bytes, so a short run or a colour's name allocates nothing.
compact_str = "0.9"
# preserve_order keeps object keys in input order, matching Python's json module.
# float_roundtrip: serde_json's default float parser takes a fast path that
# can land 1 ULP away from the value in the file, so a rendered number
# parsed back to a *different* double — ~12% of computed doubles. This
# feature makes parsing bit-for-bit accurate.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# fancy-regex supports the lookbehind/backreference features rich's ReprHighlighter uses.
fancy-regex = "0.19"
# CommonMark parser for the Markdown renderable.
pulldown-cmark = { version = "0.13", default-features = false }
# Syntax highlighting engine (Pygments-equivalent). `default-fancy` uses the
# pure-Rust fancy-regex backend, avoiding the C `onig` dependency.
# Only the bundled syntax and theme dumps are loaded (`load_defaults`), so the
# YAML/plist loaders, HTML output and dump creation stay off.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
# Image decoding for rich-art's optional image->ASCII art (jp2a-style). Only the
# PNG, JPEG, GIF and WebP decoders are enabled, keeping the tree small (WebP is
# image-webp, pure Rust, MIT OR Apache-2.0); behind rich-art's NON-default
# `image` feature so the default adds no image dependencies.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Blocking HTTP client for the CLI's URL fetch (rich-cli's `rich <url>`) and
# rs-rich-marketplace's `HttpsTransport`. Uses rustls, trusting the system's
# certificate store first (`platform-verifier`: a company proxy's or a
# sandbox's root CA is there) with Mozilla's bundled webpki roots as the
# fallback; `rich_marketplace::tls` holds the one place that chooses.
# Behind rich-cli's default `fetch` feature so lean builds can opt out.
# (ureq 3.4 wants rustc 1.85 and rustls-platform-verifier 0.7 rustc 1.71,
# both under the workspace MSRV of 1.90.)
ureq = { version = "3.4", features = ["platform-verifier"] }

# Event-driven file watching for the CLI's `--watch` (inotify, FSEvents,
# ReadDirectoryChangesW, kqueue). The polling loop remains the fallback.
notify = "8"

# Core stays safe by default; the future Windows-console port may opt back in
# per-item with an explicit `#[allow(unsafe_code)]` + justification.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Keep the core faithful and readable; deny sloppy stuff in CI.
all = { level = "warn", priority = -1 }

# `rich record` rasterises and encodes every frame of a recording. Unoptimised,
# that is the slow part of a debug build, so the recorder and its pixel crates
# are optimised even in dev builds (it changes nothing else).
[profile.dev.package.rs-rich-record]
opt-level = 3
[profile.dev.package.fontdue]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
# Sixel encoding quantizes each picture's colours: unoptimised, a video
# frame takes seconds, which starves an app drawing moving pictures (and the
# docs' tapes record debug builds), so the encoder and its quantizer are
# optimised even in dev builds too.
[profile.dev.package.icy_sixel]
opt-level = 3
[profile.dev.package.quantette]
opt-level = 3
[profile.dev.package.palette]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
# crossterm 0.29 subtracts one from mouse coordinates unchecked, so a report
# of 0 (`\e[<0;0;0M`) panicked debug builds; release builds wrap it as well.
[profile.dev.package.crossterm]
overflow-checks = false

[profile.release]
lto = "thin"
