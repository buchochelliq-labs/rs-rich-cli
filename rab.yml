  # The Python bindings: PyPI `rs-rich`, outside the Cargo workspace. Its own
  # tag format: the crate rs-rich is tagged `rs-rich-v…` (rs-rich-v0.0.12 is
  # a crate's record), and `python-v…` is what the old release_cohort.py wrote.
  - name: rs-rich
    registry: pypi
    manifest: crates/rich-py/pyproject.toml
    version: "0.0.15"
    tag: "python-v{version}"
    paths:
      - "crates/rich-py/**"
      - "Cargo.toml"
      - "crates/rich*/src/**"
      - "crates/rich*/Cargo.toml"
      - "crates/rich*/README.md"
      - "crates/rich*/LICENSE"
      - "crates/rich*/build.rs"
      - "crates/rich*/examples/**"
      - "crates/rich*/fonts/**"
      - "crates/rich-art/tests/**"
      - "crates/rich-intuituive/THIRD_PARTY.md"
      - "crates/rich-marketplace/keys/*.json"
      - "crates/rich-micro/builtin/**"
      - "crates/rich-web/assets/**"
    artifacts:
      # the old pypi-release.yml's targets and runners. The wheels are abi3 (3.9+);
      # each is installed and imported where its runner can run it, and the
      # linux x86_64 one also runs the compatibility suite against rich 15.0.0
      # and the stub check, as the old pypi-release.yml's `test` job did.
      - kind: maturin
        targets:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - {target: x86_64-apple-darwin, runner: macos-15-intel}
          - x86_64-pc-windows-msvc
        test: |
          set -euo pipefail
          python crates/rich-py/tests/smoke.py "$DIST"
          if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
            python -m pip install "$DIST"/rs_rich-*.whl "rich==15.0.0" pytest pillow "mypy==2.4.0"
            python -m pytest -q crates/rich-py/tests
            python scripts/check_python_stubs.py
          fi
