# rab, the Release Asset Bundle (formerly release-kit;
# https://github.com/buchochelliq-labs/release-asset-bundle): every package
# this repository publishes, its version, and the order to publish in. The kit
# is installed under .github/rab/ (v2.1.2; reinstall to update, never edit it)
# and documented in docs/BRANCHING.md, the release skill and
# https://buchochelliq-labs.github.io/release-asset-bundle/.
#
#   python3 .github/rab/scripts/release.py check      CI: this file matches every manifest
#   python3 .github/rab/scripts/release.py sync       copy bumped versions in from the manifests
#   python3 .github/rab/scripts/release.py status     what is published, tagged or due
#   python3 .github/rab/scripts/release.py tag        tag the release on main and wait for its run
#
# Packages are listed in publication order, each after every workspace crate
# it depends on (RELEASES.toml's order, which this file replaced after 0.0.26,
# the first release rab published in full).
#
# `paths` is what each package ships, for the kit's split check (rule 4: one
# version, one commit's files): a crate's `include` from its Cargo.toml, as
# the old release_cohort.py read it, plus Cargo.lock for the three binaries, whose
# packages carry it. The PyPI package builds from the workspace crates, so its
# paths are theirs, its own directory and the workspace manifest.

release:
  # A release is named by rs-rich-cli's version; the last package listed is
  # the PyPI rs-rich, the kit's default, so name it.
  name_from: rs-rich-cli

packages:
  - name: rs-rich
    registry: crates.io
    manifest: crates/rich/Cargo.toml
    version: "0.0.17"
    paths: ["crates/rich/src/**", "crates/rich/README.md", "crates/rich/LICENSE", "crates/rich/Cargo.toml"]

  - name: rs-rich-macros
    registry: crates.io
    manifest: crates/rich-macros/Cargo.toml
    version: "0.0.11"
    paths: ["crates/rich-macros/src/**", "crates/rich-macros/README.md", "crates/rich-macros/LICENSE", "crates/rich-macros/Cargo.toml"]

  - name: rs-rich-plugin-api
