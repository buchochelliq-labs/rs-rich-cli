    paths: ["crates/rich-plugin-api/src/**", "crates/rich-plugin-api/README.md", "crates/rich-plugin-api/LICENSE", "crates/rich-plugin-api/Cargo.toml"]

  - name: rs-rich-art
    registry: crates.io
    manifest: crates/rich-art/Cargo.toml
    version: "0.0.20"
    paths: ["crates/rich-art/src/**", "crates/rich-art/fonts/**", "crates/rich-art/examples/**", "crates/rich-art/tests/**", "crates/rich-art/README.md", "crates/rich-art/LICENSE", "crates/rich-art/Cargo.toml"]

  - name: rs-rich-diagram
