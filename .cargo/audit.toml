# cargo audit configuration (the 0.0.13 release test runs `cargo audit`).

[advisories]
ignore = [
    # bincode 1 is unmaintained (informational: no vulnerability; its authors
    # consider 1.3.3 complete). It reaches us only through syntect, whose
    # latest release (5.3.0) still depends on it for its packed syntax and
    # theme dumps. Drop this line when syntect moves off bincode 1.
    "RUSTSEC-2025-0141",
    # ttf-parser is unmaintained (informational: no vulnerability). Only
    # rs-rich-record uses it, directly and through fontdue, to read the fonts
    # it embeds (and one given to `rich record --font`). The suggested
    # replacement, skrifa, would mean replacing fontdue too: tracked for a
    # later release. Drop this line then.
    "RUSTSEC-2026-0192",
]
