# Build the documentation site and publish it to GitHub Pages, one copy of the
# docs per release with a version selector (scripts/build_versioned_docs.py):
# main's docs at /dev/, each release's from its rs-rich-cli tag at /X.Y.Z/.
# A release tag's push re-runs this workflow on main, which publishes it: the
# site is only ever deployed from main.
#
# The screenshots are NOT regenerated here — they are committed, and CI checks
# their referenced paths exist. Regenerating during deploy would let the published images
# silently disagree with the reviewed ones.
name: docs

on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes: every release publishes its docs.
    # A cohort run's release-X.Y.Z tag starts it (its rs-rich-cli-v record tag
    # goes up first, in a push too big to start workflows); a crate tag pushed
    # on its own starts it too.
    tags: ["release-*", "rs-rich-cli-v*"]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - mkdocs-python.yml
      - scripts/gen_python_api.py
      - scripts/build_versioned_docs.py
      - docs-versions.toml
      - scripts/docs_overrides/**
      # The Python site's API reference is read from the stubs and modules.
      - crates/rich-py/python/**
      # The docs playground: its crate, the libraries it renders with (a
      # change there can break a block; dev's module must follow main), the
      # xterm.js it copies, and its checks.
      - playground/**
      - crates/rich/**
      - crates/rich-ext/**
      - crates/rich-web/assets/xterm/**
      - scripts/check_playground_*.mjs
      - scripts/test_build_versioned_docs.py
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - mkdocs-python.yml
      - scripts/gen_python_api.py
      - scripts/build_versioned_docs.py
      - docs-versions.toml
      - scripts/docs_overrides/**
      # The Python site's API reference is read from the stubs and modules.
      - crates/rich-py/python/**
      # The docs playground: its crate, the libraries it renders with (a
      # change there can break a block; dev's module must follow main), the
      # xterm.js it copies, and its checks.
      - playground/**
      - crates/rich/**
      - crates/rich-ext/**
      - crates/rich-web/assets/xterm/**
      - scripts/check_playground_*.mjs
      - scripts/test_build_versioned_docs.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A new release's docs: rebuild and publish the site from main.
  release:
    name: publish a release's docs
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: build site
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      # The release tags' docs are built from history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        # MkDocs 2 drops the plugins and theme overrides the site uses.
        run: pip install "mkdocs<2" mkdocs-material "mkdocstrings[python]>=1,<2"

      # The docs playground (docs/design/docs-playground.md): main's wasm
      # modules, built into docs/assets/playground/ (never committed), so the
      # builds below copy them into the dev site. A release's own module is
      # attached to its GitHub release and downloaded by
      # build_versioned_docs.py.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-bindgen and wasm-opt
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_124/bin" >> "$GITHUB_PATH"

      - name: Build the playground's modules
        env:
          PLAYGROUND_REQUIRE_WASM_OPT: "1"
        run: |
          cargo test --manifest-path playground/Cargo.toml --locked --features full
          playground/build.sh

      # Docs as tests: every `.rich-playground` block renders with the module,
      # under Node, or the build fails.
      - name: Render every playground block
        run: node scripts/check_playground_blocks.mjs

      # --strict turns broken internal links into failures. A docs site whose
      # links rot is worse than no docs site.
      - name: Build
        run: mkdocs build --strict

      # The Python package has its own site, published under /python/. Its
      # API reference is generated from the type stubs, so no wheel is built.
      # The playground page and a guide block in headless Chromium.
      - name: Check the playground in a browser
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check_playground_page.mjs site

      - name: Check the Python API pages are current
        run: python scripts/gen_python_api.py --check

      - name: Build the Python site
        run: mkdocs build --strict -f mkdocs-python.yml

      - name: Check every referenced image exists
        run: |
          python - <<'PY'
          import re, pathlib, sys
          missing = []
          for md in pathlib.Path("docs").rglob("*.md"):
              for m in re.finditer(r'!\[[^\]]*\]\(([^)]+)\)', md.read_text(encoding="utf-8")):
                  src = m.group(1)
                  if src.startswith("http"):
                      continue
                  if not (md.parent / src).resolve().exists():
                      missing.append(f"{md}: {src}")
          if missing:
              print("Missing images:\n  " + "\n  ".join(missing))
              sys.exit(1)
          print("all image references resolve")
          PY

      - name: Test the versioned build's playground download
        run: python -m unittest discover -s scripts -p 'test_build_versioned_docs.py' -v

      # Every version into site/: main's (strict again) and the newest
      # releases' that fit under Pages' 1 GB. A pull request builds one release
      # to prove the versioned build still works.
      - name: Build every version
        run: python scripts/build_versioned_docs.py ${{ github.event_name == 'pull_request' && '--releases 1' || '' }}

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy to pages
    # Only from main; a PR build proves the site compiles without publishing it.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
