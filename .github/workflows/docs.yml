# Build the documentation site and publish it to GitHub Pages.
#
# The screenshots are NOT regenerated here — they are committed, and CI checks
# their referenced paths exist. Regenerating during deploy would let the published images
# silently disagree with the reviewed ones.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - mkdocs-python.yml
      - scripts/gen_python_api.py
      # The Python site's API reference is read from the stubs and modules.
      - crates/rich-py/python/**
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
      - mkdocs-python.yml
      - scripts/gen_python_api.py
      # The Python site's API reference is read from the stubs and modules.
      - crates/rich-py/python/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs-material "mkdocstrings[python]>=1,<2"

      # --strict turns broken internal links into failures. A docs site whose
      # links rot is worse than no docs site.
      - name: Build
        run: mkdocs build --strict

      # The Python package has its own site, published under /python/. Its
      # API reference is generated from the type stubs, so no wheel is built.
      - name: Check the Python API pages are current
        run: python scripts/gen_python_api.py --check

      - name: Build the Python site
        run: mkdocs build --strict -f mkdocs-python.yml

      - name: Check every referenced image exists
        run: |
          python - <<'PY'
          import re, pathlib, sys
          missing = []
          for md in pathlib.Path("docs").rglob("*.md"):
              for m in re.finditer(r'!\[[^\]]*\]\(([^)]+)\)', md.read_text(encoding="utf-8")):
                  src = m.group(1)
                  if src.startswith("http"):
                      continue
                  if not (md.parent / src).resolve().exists():
                      missing.append(f"{md}: {src}")
          if missing:
              print("Missing images:\n  " + "\n  ".join(missing))
              sys.exit(1)
          print("all image references resolve")
          PY

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy to pages
    # Only from main; a PR build proves the site compiles without publishing it.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
