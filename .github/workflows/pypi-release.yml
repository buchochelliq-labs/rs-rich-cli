# The old PyPI path, kept as a manual fallback until rab has published
# a release (docs/BRANCHING.md, "Which path is current"). Releases now publish
# `rs-rich` to PyPI from release.yml's `publish-pypi` job, in the same run as
# the crates; rab's `python-v…` record tags start nothing, so this
# workflow no longer starts on a tag push. It runs only when dispatched by
# hand with an existing `python-vX.Y.Z` tag, and it can upload only while
# PyPI's trusted publishers for `rs-rich` still include this file
# (`pypi-release.yml`, environment `pypi`). Retire it, and that publisher,
# once rab (formerly release-kit) has published a release.
name: pypi-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing python-vX.Y.Z tag to publish (fallback only; release.yml publishes PyPI)
        required: true

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  gate:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: The tag names the package's version, on main
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/rich-py/pyproject.toml","rb"))["project"]["version"])')"
          test "${tag}" = "python-v${version}" || { echo "tag ${tag} does not match pyproject version ${version}"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "${tag} is not on main"; exit 1; }
      # A version on PyPI is permanent: refuse the tag before building wheels.
      - name: Refuse a version already on PyPI
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/release_cohort.py unreleased "$TAG"
      # One release, one commit: the same check as release.yml's.
      - name: Refuse a tag that splits its release across commits
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/release_cohort.py same-commit "$TAG"

  wheels:
    name: wheel (${{ matrix.name }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          # Cross-build from x86_64: maturin-action's aarch64 musl bootstrap
          # download fails inside the native ARM manylinux container.
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { name: macos-arm64, os: macos-15, target: aarch64 }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64 }
          - { name: windows-x86_64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path crates/rich-py/Cargo.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install and import on Python 3.9
        if: matrix.name != 'linux-aarch64'
        shell: bash
        run: python crates/rich-py/tests/smoke.py dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and import on Python 3.13
        if: matrix.name != 'linux-aarch64'
        shell: bash
        run: python crates/rich-py/tests/smoke.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  aarch64-wheel-smoke:
    name: smoke (linux-aarch64 wheel)
    needs: wheels
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-aarch64
          path: dist
      - name: Install and import on Python 3.9
        run: python crates/rich-py/tests/smoke.py dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and import on Python 3.13
        run: python crates/rich-py/tests/smoke.py dist

  sdist:
    name: sdist
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path crates/rich-py/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test:
    # The whole suite, compatibility included, against the wheel that is
    # about to be published. Rich 15.0.0 is the reference; never install
    # rich-cli here, it would downgrade rich (see AGENTS.md).
    name: tests (linux-x86_64 wheel)
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install the wheel and the reference
        shell: bash
        run: python -m pip install dist/rs_rich-*.whl "rich==15.0.0" pytest pillow
      - name: Compatibility and API tests
        run: python -m pytest -q crates/rich-py/tests
      - name: Type stubs match the wheel
        run: |
          python -m pip install "mypy==2.4.0"
          python scripts/check_python_stubs.py

  publish:
    name: publish to PyPI
    needs: [wheels, aarch64-wheel-smoke, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi          # PyPI's trusted publisher is bound to this environment
    permissions:
      id-token: write          # Trusted Publishing: exchange the OIDC token for an upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
