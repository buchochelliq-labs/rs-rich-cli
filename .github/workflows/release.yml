# Publish a release to crates.io: every crate of it not yet published, in one
# run, from the `release-X.Y.Z` tag `scripts/release_cohort.py tag` pushes.
#
# Publishing is IRREVERSIBLE — a version can be yanked but never deleted or
# edited — so this workflow is deliberately paranoid. It checks the tag and its
# release once, re-runs the full gate on the tagged commit once, refuses to
# publish anything that is not on `main`, and aborts before upload if any
# selected crate/version already exists. The crates' own `<crate>-vX.Y.Z`
# tags are records and start nothing; dispatching one by hand publishes that
# crate alone. PyPI is pypi-release.yml's, from `python-v…` tags.
name: release

on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, release-X.Y.Z for a release (what of it is unpublished), or <crate>-vX.Y.Z for that crate alone
        required: true
      verify_only:
        description: Verify already-published exact versions without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize releases and single-crate uploads, including manual dispatches.
  # Never cancel a partially published release.
  group: crates-io-release
  cancel-in-progress: false

jobs:
  gate:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # need main to test ancestry
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}

      # The invariant the whole branching model exists to protect: a published
      # artifact must be reachable from main. See docs/BRANCHING.md.
      - name: Refuse to publish content that is not on main
        run: |
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tagged commit is on main"
          else
            echo "::error::This tag does not point at a commit on main."
            echo "::error::Tags are placed on main after the release PR merges — see docs/BRANCHING.md."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require an annotated tag and pin its validated commit
        id: commit
        run: python3 scripts/release.py validate-tag "$RELEASE_TAG"

      - name: RELEASES.toml at the tagged commit matches its manifests
        run: python3 scripts/release_cohort.py check

      # One release, one commit. Every package of a release is tagged on the
      # commit the release was cut from (release_cohort.py records it in each
      # tag's message); a package tagged on another commit that would ship
      # other code beside the rest of its release under the same numbers is
      # refused here, before the gate. The job summary names the commit.
      - name: Refuse a tag that splits its release across commits
        run: python3 scripts/release_cohort.py same-commit "$RELEASE_TAG"

      # Fail in seconds, not after the full gate: a version on crates.io is
      # permanent. For a release tag this computes the selection: every crate
      # of the release not yet on crates.io, in RELEASES.toml order, each of
      # which must have its own tag on this commit; none due is refused. A
      # crate tag selects its crate, refused when it is out. `verify_only`
      # selects what the tag already released instead.
      - name: Select what is due, refusing what is already released
        id: due
        if: ${{ inputs.verify_only != true }}
        run: python3 scripts/release_cohort.py unreleased "$RELEASE_TAG"

      - name: Select what the tag released (verify only)
        id: done
        if: ${{ inputs.verify_only == true }}
        run: python3 scripts/release_cohort.py published "$RELEASE_TAG"

      - name: Selected manifests and internal requirements must agree
        id: plan
        env:
          RELEASE_SELECTION: ${{ steps.due.outputs.selection || steps.done.outputs.selection }}
        run: python3 scripts/release.py plan "$RELEASE_TAG"

  # The same gate every PR passes, re-run on the exact tagged tree. `cargo
  # publish`'s own verification does NOT compile test targets for these crates
  # (their `include` omits tests), so this is the real check.
  ci:
    name: full gate
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.gate.outputs.sha }}

  publish:
    name: publish and verify from crates.io
    needs: [gate, ci]
    runs-on: ubuntu-latest
    environment: crates-io          # trusted publisher is bound to this environment
    # crates.io Trusted Publishing: GitHub's OIDC token is exchanged for a
    # short-lived crates.io token. A brand-new crate cannot use it (crates.io
    # offers Trusted Publishing only on an existing crate), so its first
    # version alone uploads with this environment's CARGO_REGISTRY_TOKEN.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SELECTION: ${{ needs.gate.outputs.selection }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse an already-published selected crate
        id: preflight
        if: ${{ inputs.verify_only != true }}
        run: python3 scripts/release.py preflight

      # One `cargo publish --dry-run -p a -p b …` for the whole selection:
      # each crate is packaged and verified against the earlier ones'
      # tarballs before anything uploads.
      - name: Dry run selected packages
        if: ${{ inputs.verify_only != true }}
        run: python3 scripts/release.py publish --dry-run

      # Exchange only after the preflight and dry run pass; a failed exchange
      # stops the job before anything is uploaded. Skipped when every
      # selected crate is new.
      - name: Authenticate with crates.io Trusted Publishing
        id: crates-io-auth
        if: ${{ inputs.verify_only != true && steps.preflight.outputs.existing_crate == 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      # `cargo publish -p … -p …`, once per run of crates sharing a
      # credential, in RELEASES.toml's dependency order (release.py
      # publish_runs): existing crates with the exchanged token, a brand-new
      # crate's first version with the environment's CARGO_REGISTRY_TOKEN,
      # since Trusted Publishing needs the crate to exist. The secret reaches
      # this step only when the preflight found a new crate. Add each new
      # crate's Trusted Publishing entry once it is up.
      - name: Publish selected packages
        if: ${{ inputs.verify_only != true }}
        env:
          RELEASE_NEW_CRATES: ${{ steps.preflight.outputs.new_crates }}
          RELEASE_TRUSTED_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          RELEASE_NEW_CRATE_TOKEN: ${{ steps.preflight.outputs.new_crate == 'true' && secrets.CARGO_REGISTRY_TOKEN || '' }}
        run: python3 scripts/release.py publish

      # Reuse the protected, validated checkout. Registry consumers still build
      # in fresh temporary directories, without the upload step's credential.
      - name: Wait for selected versions, then build as a stranger would
        run: python3 scripts/release.py verify

  # The docs playground's module for this release (docs/design/docs-playground.md,
  # decision 3): built from the tagged commit and attached to the release's
  # GitHub release as playground-X.Y.Z.tar.gz, which build_versioned_docs.py
  # downloads into the X.Y.Z docs. Additive: it runs only after a release tag's
  # crates are published, uploads nothing to a registry, and cannot fail the
  # run (`continue-on-error`), whose conclusion release_cohort.py waits on. A
  # crate tag, a verify-only run or a failed publish attaches nothing. The
  # job's name must not start with "publish": release_cohort.py reads such a
  # job's start as an upload.
  playground:
    name: docs playground module
    needs: [gate, publish]
    if: ${{ startsWith(inputs.tag || github.ref_name, 'release-') && inputs.verify_only != true }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release and attach the archive
      actions: write    # re-run docs.yml, so the site picks the archive up
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The playground's modules, and the `rich` CLI for its terminal.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install wasm-bindgen and wasm-opt
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_124/bin" >> "$GITHUB_PATH"

      - name: Build the modules and render every playground block
        env:
          PLAYGROUND_REQUIRE_WASM_OPT: "1"
        run: |
          playground/build.sh --tar "${RELEASE_TAG#release-}" "$RUNNER_TEMP/playground"
          node scripts/check_playground_blocks.mjs "$RUNNER_TEMP/playground"

      # The release's GitHub release is created here when there is none yet;
      # its notes point at the docs, where the release notes live.
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#release-}"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Release $version" \
              --notes "The crates of release $version, published to crates.io. Release notes: docs/releases/$version.md. playground-$version.tar.gz is the docs playground's module for the $version docs."
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/playground-$version.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # docs.yml already ran for the tag, before the archive existed.
      - name: Rebuild the docs site with it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
