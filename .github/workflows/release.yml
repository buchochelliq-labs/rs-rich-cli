# Publish a tagged version to crates.io.
#
# Publishing is IRREVERSIBLE — a version can be yanked but never deleted or
# edited — so this workflow is deliberately paranoid. It re-runs the full gate on
# the tagged commit, refuses to publish anything that is not on `main`, and
# aborts before upload if any selected crate/version already exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must already exist)
        required: true

permissions:
  contents: read

concurrency:
  # Never cancel a half-finished four-crate upload: cargo publishes them one at
  # a time and the earlier ones cannot be undone.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # need main to test ancestry
          ref: ${{ inputs.tag || github.ref }}

      # The invariant the whole branching model exists to protect: a published
      # artifact must be reachable from main. See docs/BRANCHING.md.
      - name: Refuse to publish content that is not on main
        run: |
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tagged commit is on main"
          else
            echo "::error::This tag does not point at a commit on main."
            echo "::error::Tags are placed on main after the release PR merges — see docs/BRANCHING.md."
            exit 1
          fi

      - name: Tag, manifests, and internal requirements must agree
        run: |
          python3 - "${{ inputs.tag || github.ref_name }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tomllib

          tag = sys.argv[1]
          if not tag.startswith("v"):
              raise SystemExit(f"::error::Release tag must start with v: {tag}")
          version = tag[1:]
          root = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              text=True,
          ))
          expected = {"rs-rich", "rs-rich-ext", "rs-rich-cli", "rs-rich-art"}
          selected = {p["name"]: p for p in metadata["packages"] if p["name"] in expected}
          if selected.keys() != expected:
              missing = sorted(expected - selected.keys())
              extra = sorted(selected.keys() - expected)
              raise SystemExit(f"::error::Publish selection mismatch; missing={missing}, extra={extra}")
          errors = []
          for name, package in sorted(selected.items()):
              if package["version"] != version:
                  errors.append(
                      f'{name}: manifest says {package["version"]}, tag says {version}'
                  )
          requirements = root["workspace"]["dependencies"]
          for key in ("rich", "rich-ext", "rich-art"):
              requirement = requirements[key]["version"]
              if requirement != version:
                  errors.append(
                      f'workspace dependency {key}: requirement is {requirement}, expected {version}'
                  )
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          print(f"tag v{version} selects four matching manifests and three matching requirements")
          PY

  # The same gate every PR passes, re-run on the exact tagged tree. `cargo
  # publish`'s own verification does NOT compile test targets for these crates
  # (their `include` omits tests), so this is the real check.
  ci:
    name: full gate
    needs: gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: [gate, ci]
    runs-on: ubuntu-latest
    environment: crates-io          # gate the credential behind an environment
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Refuse an already-published selected crate
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          for crate in rs-rich rs-rich-ext rs-rich-cli rs-rich-art; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: rs-rich-release-preflight' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$code" in
              404) echo "$crate@$version is available" ;;
              200)
                echo "::error::$crate@$version already exists; refusing the coordinated release."
                exit 1
                ;;
              *)
                echo "::error::Could not verify $crate@$version on crates.io (HTTP $code)."
                exit 1
                ;;
            esac
          done

      - name: Dry run
        run: cargo publish --workspace --locked --dry-run

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # `--workspace` derives the topological order itself and cross-verifies
          # dependents against sibling tarballs, so no ordering script is needed.
          # The preflight above guarantees this starts as an all-new coordinated
          # release. A partial upload requires manual recovery, not a blind rerun.
          cargo publish --workspace --locked

  verify:
    name: verify from crates.io
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Wait for the index, then install as a stranger would
        run: |
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          for attempt in 1 2 3 4 5 6; do
            # A User-Agent is mandatory; without one crates.io answers 403, which
            # is easy to misread as "not published".
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: rs-rich-release-verify' \
              "https://crates.io/api/v1/crates/rs-rich/$version")
            [ "$code" = "200" ] && break
            echo "index not ready (HTTP $code), attempt $attempt"; sleep 20
          done
          cargo install rs-rich-cli --version "$version" --root "$(mktemp -d)" --locked
          echo "installed rs-rich-cli $version from crates.io"
