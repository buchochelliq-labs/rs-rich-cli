# Publish a tagged version to crates.io.
#
# Publishing is IRREVERSIBLE — a version can be yanked but never deleted or
# edited — so this workflow is deliberately paranoid. It re-runs the full gate on
# the tagged commit, refuses to publish anything that is not on `main`, and
# aborts before upload if any selected crate/version already exists.
name: release

on:
  push:
    tags: ["v*", "rs-rich-v*", "rs-rich-plugin-api-v*", "rs-rich-macros-v*", "rs-rich-ext-v*", "rs-rich-cli-v*", "rs-rich-art-v*", "rs-rich-mermaid-v*", "rs-rich-lumis-v*", "rs-rich-record-v*", "rs-rich-interact-v*", "rs-rich-micro-v*", "rs-rich-diagram-v*", "rs-rich-data-v*", "rs-rich-ratatui-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (vX.Y.Z for all crates or rs-rich[-macros/-ext/-cli/-art]-vX.Y.Z for one)
        required: true
      verify_only:
        description: Verify already-published exact versions without uploading
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize coordinated and per-crate uploads, including manual dispatches.
  # Never cancel a partially published release.
  group: crates-io-release
  cancel-in-progress: false

jobs:
  gate:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.plan.outputs.selection }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # need main to test ancestry
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}

      # The invariant the whole branching model exists to protect: a published
      # artifact must be reachable from main. See docs/BRANCHING.md.
      - name: Refuse to publish content that is not on main
        run: |
          git fetch origin main --depth=0 2>/dev/null || git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "tagged commit is on main"
          else
            echo "::error::This tag does not point at a commit on main."
            echo "::error::Tags are placed on main after the release PR merges — see docs/BRANCHING.md."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag, selected manifests, and internal requirements must agree
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py plan "$RELEASE_TAG"

      # Fail in seconds, not after the full gate: a version on crates.io is
      # permanent, so a tag selecting one is refused here (RELEASES.toml must
      # also name the tag's version). `verify_only` checks a published release.
      - name: Refuse a tag whose version is already released
        if: ${{ inputs.verify_only != true }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release_cohort.py unreleased "$RELEASE_TAG"

      - name: Require an annotated tag and pin its validated commit
        id: commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate-tag "$RELEASE_TAG"

  # The same gate every PR passes, re-run on the exact tagged tree. `cargo
  # publish`'s own verification does NOT compile test targets for these crates
  # (their `include` omits tests), so this is the real check.
  ci:
    name: full gate
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.gate.outputs.sha }}

  publish:
    name: publish and verify from crates.io
    needs: [gate, ci]
    runs-on: ubuntu-latest
    environment: crates-io          # trusted publisher is bound to this environment
    # crates.io Trusted Publishing: GitHub's OIDC token is exchanged for a
    # short-lived crates.io token. A brand-new crate cannot use it (crates.io
    # offers Trusted Publishing only on an existing crate), so its first
    # version alone uploads with this environment's CARGO_REGISTRY_TOKEN.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_SELECTION: ${{ needs.gate.outputs.selection }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse an already-published selected crate
        id: preflight
        if: ${{ inputs.verify_only != true }}
        run: python3 scripts/release.py preflight

      - name: Dry run selected packages
        if: ${{ inputs.verify_only != true }}
        run: python3 scripts/release.py publish --dry-run

      # Exchange only after the preflight and dry run pass; a failed exchange
      # stops the job before anything is uploaded.
      - name: Authenticate with crates.io Trusted Publishing
        id: crates-io-auth
        if: ${{ inputs.verify_only != true && steps.preflight.outputs.new_crate != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish selected packages
        if: ${{ inputs.verify_only != true && steps.preflight.outputs.new_crate != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/release.py publish

      # A brand-new crate's first version: the environment's token, since
      # Trusted Publishing needs the crate to exist. The preflight refuses a
      # selection mixing new and existing crates, so this never uploads an
      # existing one. Add the crate's Trusted Publishing entry once it succeeds.
      - name: Publish a new crate's first version
        if: ${{ inputs.verify_only != true && steps.preflight.outputs.new_crate == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::A new crate needs CARGO_REGISTRY_TOKEN in the crates-io environment for its first upload"
            exit 1
          fi
          python3 scripts/release.py publish

      # Reuse the protected, validated checkout. Registry consumers still build
      # in fresh temporary directories, without the upload step's credential.
      - name: Wait for selected versions, then build as a stranger would
        run: python3 scripts/release.py verify
