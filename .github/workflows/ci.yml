name: CI

on:
  # Callable so the release workflow re-runs this identical gate on the
  # tagged commit — cargo publish's own verification does not compile tests.
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact validated commit for a release; omitted for ordinary CI
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

# A pull request's newer run cancels its older one. Every other event gets a
# group of its own (the run id), so runs on main, tags, schedules and release
# calls are never cancelled, nor dropped while pending as a shared
# `github.ref` group would drop them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. Without this the workflow inherits the repository default,
# which may include write scopes it has no use for — CI only ever reads the
# tree. Flagged by CodeQL; the other workflows already declare theirs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tests:
    name: release workflow regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Check manifest-version documentation
        run: python3 scripts/gen_versions.py --check

      - name: The micro asset gallery matches the built-in library
        run: |
          python3 -m pip install pillow
          python3 scripts/micro_gallery.py --check

      - name: RELEASES.toml matches the manifests and the dependency order
        run: python3 scripts/release_cohort.py check

      # The docs playground spike has a workspace and a lockfile of its own,
      # which no other job builds: a version bump that leaves it stale shows
      # here (0.0.23 plan, item 15).
      - name: The playground spike's lockfile is current
        run: cargo metadata --locked --format-version 1 --manifest-path playground/spike/Cargo.toml > /dev/null

      - name: Test release selection and registry verification
        run: python3 -m unittest discover -s scripts -p 'test_release*.py' -v

      - name: Test the failing-test report
        run: python3 -m unittest discover -s scripts -p 'test_test_failures.py' -v

      - name: Test the public API and SemVer checks
        run: python3 -m unittest discover -s scripts -p 'test_api_checks.py' -v

      # The listing format (docs/design/marketplace.md): the examples against
      # the schema, with jsonschema as well as the script's own evaluator.
      - name: Marketplace listings validate, and the bad examples do not
        run: |
          python3 -m pip install jsonschema
          python3 scripts/validate_marketplace.py --jsonschema require schemas/marketplace/examples/valid/*.json
          python3 scripts/validate_marketplace.py --jsonschema require --expect-invalid schemas/marketplace/examples/invalid/*.json
          python3 -m unittest discover -s scripts -p 'test_validate_marketplace.py' -v

  packages:
    name: registry source identity and staged packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `cargo package --all-features` builds rs-rich-intuituive's `audio`
      # feature, whose cpal needs ALSA's headers on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Needs live crates.io access; registry failures are failures, never skips.
      # Unpublished siblings are staged by Cargo. This is not a publish dry run.
      - name: Verify registry identity before staged artifact builds
        run: python3 scripts/check_packages.py

  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The fuzz targets (fuzz/, a workspace of their own) are formatted,
      # still build against the crates' APIs, and their lockfile is current.
      # Fuzzing itself runs nightly (fuzz.yml); a check needs no nightly.
      - name: The fuzz targets build
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --locked --manifest-path fuzz/Cargo.toml --bins

      # The run's output is kept: a failure in an early test target ends up
      # far above the end of the log, so the next step prints each failing
      # test's output at the end and in the job summary.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --all 2>&1 | tee test.log

      - name: Show the failing tests
        if: failure()
        run: python3 scripts/test_failures.py test.log | tee -a "$GITHUB_STEP_SUMMARY"

      # `rich serve` is behind the CLI's off-by-default `serve` feature, so
      # the default test run above has none of it: its unit tests (with the
      # spec/parser drift checks seeing its options) and its end-to-end test.
      - name: Test the CLI's serve feature
        run: cargo test -p rs-rich-cli --features serve --locked --lib --test serve

      - name: Check generated CLI reference
        run: |
          cargo build -p rs-rich-cli --locked
          python3 scripts/gen_cli_reference.py --binary target/debug/rich --check

      # `default-features = false` must actually drop syntect (and with it
      # bincode 1.x and a second fancy-regex) and pulldown-cmark, for core and
      # for ext, or the features are decoration.
      - name: Lean builds carry no syntect, bincode or pulldown-cmark
        run: |
          for crate in rs-rich rs-rich-ext; do
            found="$(cargo tree -p "$crate" --no-default-features -e normal --prefix none \
              | grep -E '^(syntect|bincode|pulldown-cmark|onig) ' || true)"
            if [ -n "$found" ]; then
              echo "::error::$crate without default features still depends on:"
              echo "$found"
              exit 1
            fi
          done
          # `code` and `markdown` keep `Syntax` and `Markdown` without syntect,
          # for a highlighter such as rs-rich-ext's `sql`.
          found="$(cargo tree -p rs-rich-ext --no-default-features \
            --features sql,markdown -e normal --prefix none \
            | grep -E '^(syntect|bincode|onig) ' || true)"
          if [ -n "$found" ]; then
            echo "::error::rs-rich-ext with sql and core's code,markdown still depends on:"
            echo "$found"
            exit 1
          fi

      - name: Verify interactive stdin and NO_COLOR in a terminal
        run: python3 scripts/test_cli_terminal.py --binary target/debug/rich

      - name: Verify guided tour playback and interruption
        run: python3 scripts/test_demo_pty.py --binary target/debug/rich

      - name: Verify coordinated Live resize and cleanup
        run: python3 scripts/test_live_regions_pty.py

      - name: Verify batch cancellation and progress
        run: python3 scripts/test_batch_v9.py target/debug/rich

      - name: Verify workflow output snapshots
        run: python3 scripts/snapshot_cli.py --cases scripts/fixtures/workflow_snapshots.jsonl --snapshots scripts/fixtures/workflow_snapshots --command target/debug/rich

      - name: Verify watch recovery in a terminal
        run: python3 scripts/test_watch_workflows.py --binary target/debug/rich -v

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: rs-rich
            args: "--all-features"
          # Without syntect and pulldown-cmark: no `Syntax`, no `Markdown`.
          - crate: rs-rich
            args: "--no-default-features"
          # `Syntax` and `Markdown` without syntect: code renders through a
          # registered highlighter, or plain.
          - crate: rs-rich
            args: "--no-default-features --features code,markdown"
          # rich-art is zero-dependency by default; its image/GIF support is
          # opt-in, and each config compiles different code. `--all-features`
          # rather than naming them, so new features are covered automatically.
          - crate: rs-rich-plugin-api
            args: ""
          - crate: rs-rich-macros
            args: ""
          - crate: rs-rich-ext
            args: "--all-features"
          - crate: rs-rich-ext
            args: "--no-default-features"
          # QR codes on their own (qrcodegen), without syntect or Markdown;
          # `--all-features` above covers them with everything else.
          - crate: rs-rich-ext
            args: "--no-default-features --features qr"
          # The SQL highlighter on its own: no syntect, no `Syntax`.
          - crate: rs-rich-ext
            args: "--no-default-features --features sql"
          # The SQL highlighter behind core's `Syntax` and Markdown fences,
          # still without syntect (the `sql_without_syntect` test).
          - crate: rs-rich-ext
            args: "--no-default-features --features sql,markdown"
          - crate: rs-rich-art
            args: ""
          - crate: rs-rich-art
            args: "--all-features"
          # Text flowcharts only, and with the mmdc backend compiled in (its
          # real-mmdc test runs in the `mermaid-cli` job).
          - crate: rs-rich-mermaid
            args: ""
          - crate: rs-rich-mermaid
            args: "--all-features"
          # The tape recorder (PTY, VT emulator, embedded font).
          - crate: rs-rich-record
            args: ""
          # Interactive components: session, event loop, PTY restoration.
          - crate: rs-rich-interact
            args: ""
          # The Vim preset for the text editors, off by default.
          - crate: rs-rich-interact
            args: "--features vim"
          # Micro assets: model, packages, registry, markup (hostile-package
          # conformance tests included).
          - crate: rs-rich-micro
            args: ""
          # The graph model, layered layout and Diagram renderable (Mermaid's
          # flowcharts draw through it; its snapshots are checked from both).
          - crate: rs-rich-diagram
            args: "--all-features"
          # Tabular adapters, inference and statistics: the CSV/JSONL/serde
          # default, and the Arrow adapter behind its off-by-default feature.
          - crate: rs-rich-data
            args: ""
          - crate: rs-rich-data
            args: "--all-features"
          # ratatui interop: rich renderables as ratatui widgets and the
          # buffer conversions (rich + ratatui-core only), and with the
          # off-by-default `interact` feature's `RatatuiComponent`.
          - crate: rs-rich-ratatui
            args: ""
          - crate: rs-rich-ratatui
            args: "--all-features"
          # intuiTUIve, the TUI framework, with both of interact's extra
          # backends (each alone, and on macOS, in `backends`) and its
          # `art`, `audio` (ALSA headers installed below), `watch`, `files`,
          # `archive`, `viz` and `tracing` features. Its benchmark against ratatui runs in release in
          # `ratatui-gate`.
          - crate: rs-rich-intuituive
            args: "--all-features"
          # Serving apps and programs to a browser (no features of its own):
          # its tests open real sockets on 127.0.0.1 and run programs on a
          # PTY, and build.rs checks the vendored xterm.js against its
          # pinned hashes.
          - crate: rs-rich-web
            args: "--all-features"
          # The terminal pane and the web view: the pane, ProgramEngine and
          # the test hosts by default; with the Chrome (DevTools) and Browsh
          # engines behind their off-by-default features. The test against a
          # real Chrome runs only when RICH_EMBED_CHROME names one.
          - crate: rs-rich-embed
            args: ""
          - crate: rs-rich-embed
            args: "--all-features"
          # The marketplace client: the signed index, key chain, listings,
          # resolution and installs against a fixture marketplace signed
          # with test keys (no network), with and without its `http`
          # transport.
          - crate: rs-rich-marketplace
            args: ""
          - crate: rs-rich-marketplace
            args: "--no-default-features"
          # Noctiluca, the terminal browser: its model, layout, config and
          # app tests on Chrome's saved snapshots of its fixture pages, and
          # its binary on a PTY (the test-only `fake-engine` feature; the
          # default build is the workspace jobs'). Its live tests need a
          # browser and a normal user: the `browser` job runs them.
          - crate: noctiluca
            args: "--features fake-engine"
          # Every lumis language (its default); the bundles only select fewer.
          - crate: rs-rich-lumis
            args: ""
          # The CLI must still build without network or image decoders.
          - crate: rs-rich-cli
            args: "--no-default-features"
          # `rich serve` (rs-rich-web) on top of the defaults: off by default.
          - crate: rs-rich-cli
            args: "--features serve"
          - crate: rs-rich-cli
            args: "--all-features"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # intuiTUIve's `audio` feature captures through cpal, which needs
      # ALSA's headers on Linux.
      - name: Install ALSA headers
        if: matrix.crate == 'rs-rich-intuituive'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Clippy (${{ matrix.crate }} ${{ matrix.args }})
        run: cargo clippy -p ${{ matrix.crate }} --all-targets ${{ matrix.args }} -- -D warnings

      - name: Test (${{ matrix.crate }} ${{ matrix.args }})
        run: cargo test -p ${{ matrix.crate }} ${{ matrix.args }}

  # rs-rich-interact's termion and termwiz backends (#677, #678), each on its
  # own, on Linux and macOS: the PTY conformance suites (interact's
  # `pty_backends`, intuiTUIve's `backends`) run every test against crossterm
  # and the feature's backend. termwiz also on Windows (#721): both crates
  # and every target built with it, and their suites, headless there (the PTY
  # suites are Unix only, as is termion).
  backends:
    name: interact backend (${{ matrix.feature }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        feature: [termion, termwiz]
        include:
          - os: windows-latest
            feature: termwiz
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.feature }})
        run: >-
          cargo clippy -p rs-rich-interact -p rs-rich-intuituive --all-targets --locked
          --features rs-rich-interact/${{ matrix.feature }},rs-rich-intuituive/${{ matrix.feature }}
          -- -D warnings

      - name: Test (${{ matrix.feature }})
        run: >-
          cargo test -p rs-rich-interact -p rs-rich-intuituive --locked
          --features rs-rich-interact/${{ matrix.feature }},rs-rich-intuituive/${{ matrix.feature }}

  windows-pager:
    name: Windows system pager
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test pager selection and launch the native Windows pager
        run: cargo test -p rs-rich --locked --lib pager::tests -- --test-threads=1

      # bash, so each command's failure fails the step: PowerShell's step
      # answers with the last command's exit code alone.
      - name: Test Windows batch paths and CLI pager controls
        shell: bash
        run: |
          cargo test -p rs-rich-cli --locked --bin rich batch::tests
          cargo test -p rs-rich-cli --locked --bin rich batch_races
          cargo test -p rs-rich-cli --locked --test batch_v8 --test batch_paths --test pager_v8 --test demo

  # rs-rich-web's process per session on Windows: each session's process in
  # a job object, which ends it and what it started when the session ends or
  # the server dies. Only these tests; the rest of the crate's run on Linux
  # and macOS. It also lints, on Windows, the core, intuiTUIve and the CLI's
  # tests, whose code differs off Unix and off Linux.
  windows-web:
    name: Windows web sessions
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (rs-rich-web, Windows)
        run: cargo clippy -p rs-rich-web --all-targets --locked -- -D warnings

      # bash, so each command's failure fails the step. intuiTUIve with all
      # its features (cpal's WASAPI; the web job builds most of it already);
      # the CLI without its default features, to keep the step short: the
      # Unix-only code its tests gate is the same either way.
      - name: Clippy (rs-rich, intuiTUIve, the CLI's tests; Windows)
        shell: bash
        run: |
          cargo clippy -p rs-rich --all-targets --locked -- -D warnings
          cargo clippy -p rs-rich-intuituive --all-features --all-targets --locked -- -D warnings
          cargo clippy -p rs-rich-cli --no-default-features --all-targets --locked -- -D warnings

      # One command a step: in a pwsh step of several, only the last one's
      # exit code would fail it.
      - name: Build the session examples
        run: cargo build -p rs-rich-web --locked --examples

      - name: Test session job objects
        run: cargo test -p rs-rich-web --locked --test isolation_windows

  # The whole workspace's tests on macOS: PTYs, terminal modes, signals and
  # paths differ enough from Linux to break on their own.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The unified-diff tests compare against GNU diff; macOS's `diff` is
      # BSD's. Homebrew's diffutils installs it as `gdiff`.
      - name: Install GNU diffutils
        run: brew install diffutils

      # macOS's /bin/bash is 3.2, older than the shell integration supports
      # (it says so and sets nothing up), so its end-to-end test would skip
      # itself. Homebrew's bash, first on PATH, makes it run here as it does
      # for macOS users who have it.
      - name: Install bash
        run: brew install bash && bash --version | head -1

      # The run's output is kept: a failure in an early test target ends up
      # far above the end of the log, so the next step prints each failing
      # test's output at the end and in the job summary.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --all --locked --no-fail-fast 2>&1 | tee test.log

      - name: Show the failing tests
        if: failure()
        run: python3 scripts/test_failures.py test.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test core without syntect and pulldown-cmark
        run: cargo test -p rs-rich --no-default-features --locked

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Read rust-version from the workspace
        id: msrv
        run: |
          version="$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)"
          echo "Declared MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds on exactly the declared version, so `rust-version` can't drift
      # into fiction again (it previously claimed 1.74 while the tree needed 1.88).
      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--all-features` takes in intuiTUIve's `audio` (cpal: ALSA on Linux).
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The CLI's `lumis` feature pulls in rs-rich-lumis, so here the CLI is
      # checked with every other feature, and with `lumis` on lumis's MSRV below.
      - name: Check the whole workspace on the declared MSRV
        run: |
          cargo check --workspace --all-targets --all-features --exclude rs-rich-lumis --exclude rs-rich-cli
          cargo check -p rs-rich-cli --all-targets --features "fetch art mermaid mmdc syntax-cache onig json-escape-safe dylib-plugins wasm-plugins arrow serve"

      # rs-rich-lumis declares its own minimum, lumis's (newer than the
      # workspace's), and is checked on exactly that.
      - name: Read rust-version from rs-rich-lumis
        id: lumis-msrv
        run: |
          version="$(grep -m1 '^rust-version' crates/rich-lumis/Cargo.toml | cut -d'"' -f2)"
          echo "Declared rs-rich-lumis MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the rs-rich-lumis toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.lumis-msrv.outputs.version }}

      - name: Check rs-rich-lumis, and the CLI with every feature, on its declared MSRV
        run: cargo +${{ steps.lumis-msrv.outputs.version }} check -p rs-rich-lumis -p rs-rich-cli --all-targets --all-features

  parity:
    name: golden parity vs upstream rich
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned upstream rich
        run: |
          version="$(python scripts/read_upstream_version.py)"
          echo "Pinned rich version: $version"
          python -m pip install "rich==$version"

      - name: Regenerate golden fixtures from real rich
        env:
          PYTHONUTF8: "1" # deterministic UTF-8 box glyphs (no ASCII substitution)
        run: env -u NO_COLOR TERM=xterm-256color python scripts/capture_golden.py

      - name: Fail if our fixtures drifted from upstream
        run: git diff --exit-code crates/rich/tests/golden

      - name: Run parity tests
        run: cargo test -p rs-rich --test golden

      - name: Run differential corpus
        env:
          PYTHONUTF8: "1"
        run: |
          env -u NO_COLOR TERM=xterm-256color python -m unittest discover -s scripts -p 'test_diff*.py' -v
          env -u NO_COLOR TERM=xterm-256color python scripts/diff_rich.py

  # The `mmdc` Mermaid backend against the real Mermaid CLI (Node and headless
  # Chromium): a flowchart, a sequence, a class and a state diagram render, and
  # show as Sixel or blocks. Everywhere else its fallbacks are tested with fakes.
  mermaid-cli:
    name: Mermaid CLI backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install @mermaid-js/mermaid-cli
        run: |
          npm install --global @mermaid-js/mermaid-cli@11
          mmdc --version
          # The runner's AppArmor policy blocks Chromium's sandbox.
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Render with the real mmdc
        env:
          RICH_MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
        run: |
          export RICH_MERMAID_MMDC="$(command -v mmdc)"
          cargo test -p rs-rich-mermaid --locked --features mmdc --test mmdc -- --nocapture

  # One stable, aggregate context for branch protection to require.
  #
  # Requiring the individual jobs by name looks tighter but is a trap: the
  # `features` matrix expands to names like "feature matrix (rs-rich-art)", so
  # renaming a package silently orphans the required context. That happened here
  # — the crates.io rename left four required checks that could never report, and
  # every PR sat "expected — waiting for status" with a fully green run. The only
  # way through is an admin bypass, which trains the habit that defeats every
  # other guardrail.
  #
  # Require `ci-ok` and nothing else from this workflow. Adding or renaming jobs
  # then never touches branch protection again.
  # Every docs recording is a tape (docs/tapes/*.tape) run against the binary
  # built here, by that binary's own `rich record` (#599). Re-run them and
  # compare each screenshot's text grid with the committed one, so docs media
  # cannot drift from the CLI (#598).
  tapes:
    name: docs tapes up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install less (the pager tape pages through it), zsh, fish and w3m (the embed tape's web view)
        run: |
          sudo apt-get update
          sudo apt-get install -y less zsh fish w3m

      # The CLI with its `serve` feature (the serve tape), the interact
      # examples (the viewport tape), and the intuiTUIve and embed examples;
      # intuiTUIve's with `files` (the files example needs it), `archive`,
      # `watch` and `art`, so the files tape lists an archive, follows the
      # disk and draws its image preview, `pcm`, which the scope example
      # needs, `viz` (meters, sparklines and spectra), `wav` (the music
      # example, with `art`), and rs-rich-ext's `yaml` and `jsonpath` (the
      # http example) and `data` (the tasks example), named by the
      # dependency's name, as their `required-features` name them.
      - name: Build the CLI and the examples the tapes run
        run: >-
          cargo build -p rs-rich-cli -p rs-rich-interact -p rs-rich-intuituive
          -p rs-rich-embed -p noctiluca --features rs-rich-cli/serve,rs-rich-intuituive/files,rs-rich-intuituive/archive,rs-rich-intuituive/watch,rs-rich-intuituive/art,rs-rich-intuituive/pcm,rs-rich-intuituive/viz,rs-rich-intuituive/wav,rs-rich-intuituive/vim,rich-ext/yaml,rich-ext/jsonpath,rich-ext/data,noctiluca/fake-engine
          --bins --examples --locked

      # rs-rich-ext's examples are guide programs; the surface tape runs one.
      - name: Build the example the surface tape runs
        run: cargo build -p rs-rich-ext --example guide_surface --locked

      - name: Check every tape's screenshots
        run: >-
          target/debug/rich record --check --bin-dir target/debug
          --output docs/media/tapes docs/tapes/*.tape

      # `Set Shell`: a recording in each of the four shells, none skipped.
      - name: Record in bash, zsh, fish and sh
        env:
          RICH_RECORD_REQUIRE_SHELLS: bash,zsh,fish,sh
        run: >-
          cargo test -p rs-rich-record --locked --test record
          every_shell_records_with_the_same_prompt -- --nocapture

  # Noctiluca's and rs-rich-embed's live tests against a real Chrome
  # (docs/design/browser.md, decision 6). The engine never turns Chrome's
  # sandbox off, so they run as the runner's normal user, never as root.
  # Ubuntu 24.04's AppArmor restricts the user namespaces the sandbox
  # needs; that restriction is lifted on this runner. Local pages only.
  browser:
    name: live browser tests (Chrome, as a normal user)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The runner image has Google Chrome; install it if a new image does not.
      - name: Find or install Chrome
        run: |
          if ! command -v google-chrome >/dev/null; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update && sudo apt-get install -y /tmp/chrome.deb
          fi
          echo "RICH_EMBED_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version

      - name: Let Chrome's sandbox make its namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Live tests (as a normal user)
        run: |
          test "$(id -u)" != 0
          cargo test --locked -p rs-rich-embed --features chrome
          cargo test --locked -p noctiluca --features fake-engine

      # What reading a page costs, per fixture: reported, never failed.
      - name: Snapshot cost (reported)
        run: |
          {
            echo '### Noctiluca: snapshot cost on the fixture pages'
            echo
            cargo run --release --locked -p noctiluca --example capture -- --cost crates/noctiluca/tests/fixtures/*.html
          } >> "$GITHUB_STEP_SUMMARY" || true

  # Every guide screenshot is the output of the example program next to it on
  # its page (scripts/capture_guide.py). Rendering them again and diffing
  # catches a picture that no longer matches its code.
  guide-screenshots:
    name: guide screenshots up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Render every guide example and compare with docs/media/guide
        run: python3 scripts/capture_guide.py --check

  # intuiTUIve's public bar (docs/design/intuituive.md, decision 4): the same
  # dashboard drawn by intuiTUIve and by ratatui, in memory, in release. It
  # fails if intuiTUIve is slower than ratatui on a status tick or a selection
  # move, more than 1.5x slower on a log append, or sends more bytes.
  ratatui-gate:
    name: intuiTUIve vs ratatui benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Benchmark against ratatui (release)
        run: cargo test --release --locked -p rs-rich-intuituive --test versus_ratatui -- --ignored --nocapture

  # The paint benchmark (docs/design/render-performance.md, "Benchmarks"):
  # nine scenes at 80x24 and 200x60 under every paint strategy, each frame's
  # bytes replayed through vt100 and checked against a full repaint. It
  # reports the table the design note keeps, and fails if `best` is more
  # than 5% worse, in bytes or time, than the best fixed strategy on a scene.
  paint-bench:
    name: Paint strategies benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Benchmark the paint strategies (release)
        env:
          PAINT_BENCH_GATE: "1"
        run: cargo test --release --locked -p rs-rich-intuituive --test paint_bench -- --ignored --nocapture paint_strategies_benchmark

  # The browser build (docs/design/docs-playground.md, tier 3): the core, the
  # extensions, rs-rich-interact and intuiTUIve for wasm32-unknown-unknown,
  # with and without syntect, so a new crossterm, `Instant` or thread call
  # outside the crates' wasm gates fails here rather than in the playground.
  # rs-rich-web without its server (`default-features = false`), whose
  # input decoder the playground uses; and the CLI for wasm32-wasip1.
  wasm:
    name: wasm32 build (playground crates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check (default features)
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p rs-rich -p rs-rich-ext -p rs-rich-interact -p rs-rich-intuituive

      - name: Check (no syntect, as an app build)
        run: >-
          cargo check --locked --target wasm32-unknown-unknown --no-default-features
          -p rs-rich -p rs-rich-ext -p rs-rich-interact -p rs-rich-intuituive -p rs-rich-web

      - name: Check (the explorer and intuiTUIve's plugins that build there)
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p rs-rich-interact -p rs-rich-intuituive
          --features rs-rich-interact/data,rs-rich-intuituive/viz,rs-rich-intuituive/files

      # The playground's terminal (tier 2) runs the CLI on WASI: a change in a
      # crate the CLI uses that breaks that build fails here, on its own PR.
      - name: Check (the CLI on WASI)
        run: >-
          cargo check --locked --target wasm32-wasip1
          -p rs-rich-cli --no-default-features --features art,mermaid

  # WASM plugins in an optimised build (docs/design/fuzzing.md, "Known
  # findings"): the `memory.grow` stack overflow the fuzz targets found
  # showed only with `--release` (wasmi's dispatch differs from a debug
  # build's). rs-rich-ext's sandbox tests, and the CLI's tests that load
  # modules: the test marketplace's installs, the official artifacts and
  # `--plugin`.
  wasm-plugins-release:
    name: WASM plugins (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: The WASM plugin tests (release)
        run: >-
          cargo test --release --locked
          -p rs-rich-ext --features wasm-plugins --test wasm_plugins

      - name: The CLI's tests that load WASM plugins (release)
        run: >-
          cargo test --release --locked
          -p rs-rich-cli --test plugin_marketplace --test official_artifacts --test plugins

  # The plugin marketplace against this host (docs/design/marketplace.md):
  # a test marketplace written from crates/rich-cli/tests/plugin_marketplace.rs,
  # signed with rs-rich-marketplace's test key, listing the official plugins
  # (Mermaid, DOT, lumis) at this workspace's versions, a fixture WASM
  # plugin, and the official `textcase` WASM plugin and built-in micro packs
  # as the marketplace repository lists them (tests/support/official.rs
  # rebuilds them; tests/official_artifacts.rs pins their hashes). The built
  # binary installs from it with no network: each crate resolves for this
  # host's plugin API and is refused with its `cargo add` line, each WASM
  # plugin installs (its manifest checked in the sandbox), verifies and loads
  # on the next run without --plugin, and each micro pack installs and loads
  # into micro's user layer.
  plugin-compatibility:
    name: plugin marketplace compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build rich (WASM plugins are a default feature)
        run: cargo build -p rs-rich-cli --locked

      - name: Write the test marketplace
        run: >-
          RICH_TEST_MARKETPLACE="$RUNNER_TEMP/marketplace"
          cargo test -p rs-rich-cli --locked --test plugin_marketplace
          -- --ignored --exact write_test_marketplace

      - name: The official artifacts rebuild to their pinned hashes
        run: cargo test -p rs-rich-cli --locked --test official_artifacts

      - name: Install the official plugins and the fixture plugin
        env:
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          export RICH_MARKETPLACE="$RUNNER_TEMP/marketplace"
          export RICH_MARKETPLACE_KEYS="$RUNNER_TEMP/marketplace/keys/keys-1.json"
          export RICH_PLUGIN_DIR="$RUNNER_TEMP/plugins"
          rich="$PWD/target/debug/rich"
          for id in mermaid dot lumis; do
            "$rich" plugin info "$id" --report json 2> info.json
            jq -e '.ok and .result.candidate != null and .result.versions[0].compatible' info.json
            code=0
            "$rich" plugin install "$id" --yes 2> refusal.txt || code=$?
            test "$code" = 2
            grep -q "cargo add rs-rich-" refusal.txt
          done
          "$rich" plugin install shout --yes
          "$rich" plugin verify
          "$rich" plugin list
          "$rich" plugins list | grep -E 'shout +.*wasm'
          printf '# Doc\n\n```shout\nhello there\n```\n' > doc.md
          "$rich" -m doc.md | tee rendered.txt
          grep -qE '^hello there *$' rendered.txt
          "$rich" plugin install textcase --yes
          "$rich" --transform upcase -p "official" > rendered.txt
          grep -q OFFICIAL rendered.txt
          printf '```loud\nhello there\n```\n' > loud.md
          "$rich" -m loud.md > rendered.txt
          grep -q "HELLO THERE" rendered.txt
          for pack in status dev fun; do
            "$rich" plugin install "$pack" --yes
          done
          "$rich" plugin verify
          # Installed packs load into micro's user layer with no other step.
          "$rich" micro packs --report json > packs.json
          for pack in status dev fun; do
            jq -e --arg p "$RICH_PLUGIN_DIR/$pack/$pack-1.0.0.richmicro" \
              '[.packs[] | select(.layer == "user" and .path == $p)] | length == 1' packs.json
          done
          # An installed theme is what `--theme ID` selects.
          "$rich" plugin install dusk --yes
          "$rich" --theme dusk -p "[alert]themed[/]" | grep -q themed
          rm -f info.json refusal.txt doc.md rendered.txt loud.md packs.json

  # Every published crate's public API against its snapshot in api/ (an
  # API change shows in review as a snapshot change), and cargo-semver-checks
  # against each crate's last release: Cargo's rule for the version bump,
  # and every 0.0.x breaking change listed in api/semver-breaks.toml. The
  # tools are pinned in api/tools.toml and cached once built.
  api:
    name: public API and SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the pinned tools
        id: tools
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          tools = tomllib.load(open("api/tools.toml", "rb"))
          for key, value in tools.items():
              print(f"{key.replace('-', '_')}={value}")
          PY

      - name: Install the nightly that writes rustdoc JSON
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.nightly }}

      - name: Install the toolchain cargo-semver-checks reads
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.semver_checks_toolchain }}

      - name: Cache the API tools
        id: api-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-public-api
            ~/.cargo/bin/cargo-semver-checks
          key: api-tools-${{ runner.os }}-${{ hashFiles('api/tools.toml') }}

      - name: Install the API tools
        if: steps.api-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-public-api --version "${{ steps.tools.outputs.cargo_public_api }}"
          cargo install --locked cargo-semver-checks --version "${{ steps.tools.outputs.cargo_semver_checks }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: api

      # All features: intuiTUIve's `audio` needs ALSA's headers.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Public API snapshots match (python scripts/public_api.py --bless to update)
        run: python3 scripts/public_api.py --check

      - name: SemVer against each crate's last release
        run: python3 scripts/semver_check.py

  ci-ok:
    name: ci-ok
    needs: [check, features, macos, msrv, parity, release-tests, api, windows-pager, windows-web, packages, mermaid-cli, tapes, guide-screenshots, ratatui-gate, paint-bench, wasm, wasm-plugins-release, plugin-compatibility, browser]
    # `always()` so this reports failure rather than being skipped when a
    # dependency fails — a skipped required check blocks the PR forever.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job did not succeed (got '$r')."
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
