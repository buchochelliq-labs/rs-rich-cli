# Makes the pull-request template mandatory rather than decorative.
#
# GitHub cannot require a PR body to be filled in, so this does it: the required
# sections must be present AND contain real prose, not the template's own comment
# prompts. Without this the template is a suggestion, and suggestions decay.
name: pr hygiene

on:
  pull_request:
    # `edited` matters: fixing the body must be able to clear the check without
    # pushing a commit.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  body:
    name: pr body
    runs-on: ubuntu-latest
    # Bots do not use our template and their PRs are mechanical.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Check required sections are present and filled
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED = [
              'What & why',
              'How this was verified',
              'Parity impact',
              'Risk',
            ];

            const body = context.payload.pull_request.body || '';
            const problems = [];

            if (!body.trim()) {
              problems.push('The description is empty. The template is there to be filled in.');
            }

            // Split into `## ` sections by walking the lines. Parsing this way
            // rather than with a regex per heading avoids depending on what
            // follows a section — an earlier version anchored on "next heading
            // or end of input" and silently rejected any PR whose last section
            // was a required one.
            const sections = new Map();
            let current = null;
            for (const line of body.split(/\r?\n/)) {
              const heading = line.match(/^##\s+(.+?)\s*$/);
              if (heading) {
                current = heading[1].trim().toLowerCase();
                if (!sections.has(current)) sections.set(current, []);
              } else if (current) {
                sections.get(current).push(line);
              }
            }

            for (const heading of REQUIRED) {
              const lines = sections.get(heading.toLowerCase());
              if (!lines) {
                problems.push(`Missing section: "## ${heading}".`);
                continue;
              }
              // Strip HTML comments — the template's prompts live in them, and a
              // section containing only its prompt has not been filled in.
              const content = lines.join('\n').replace(/<!--[\s\S]*?-->/g, '').trim();
              if (!content) {
                problems.push(
                  `Section "## ${heading}" is empty. ` +
                  `Replace the prompt with your answer ("N/A — <reason>" is fine).`
                );
              }
            }

            // Unticked boxes are allowed — the checklist is a reminder, not a
            // gate. Leaving the whole checklist out is not.
            if (!sections.has('checklist')) {
              problems.push('Missing the "## Checklist" section.');
            }

            if (problems.length) {
              core.setFailed(
                'Pull request description is incomplete:\n\n' +
                problems.map((p) => `  • ${p}`).join('\n') +
                '\n\nEdit the description and this check re-runs automatically.' +
                '\nThe template is .github/pull_request_template.md.'
              );
            } else {
              core.info('All required sections present and filled.');
            }

  readiness:
    name: release readiness
    runs-on: ubuntu-latest
    # Bots do not run release prep and often cannot satisfy human handoff rules.
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - uses: actions/checkout@v4
      - name: Check review threads and release handoff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const policy = JSON.parse(
              fs.readFileSync('.github/release-readiness.json', 'utf8')
            );
            const reviewThreads = [];
            let snapshot = null;
            let cursor = null;
            let hasNextPage = true;
            while (hasNextPage) {
              const { repository } = await github.graphql(`
              query($owner:String!,$repo:String!,$number:Int!,$cursor:String) {
                repository(owner:$owner,name:$repo) {
                  pullRequest(number:$number) {
                    headRefOid
                    mergeable
                    mergeStateStatus
                    reviewDecision
                    reviewThreads(first:100, after:$cursor) {
                      nodes {
                        isResolved
                        path
                        line
                        comments(first:1) {
                          nodes { body }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }`,
                { owner, repo, number: pr.number, cursor }
              );
              const page = repository.pullRequest.reviewThreads;
              snapshot ??= {
                headRefOid: repository.pullRequest.headRefOid,
                mergeable: repository.pullRequest.mergeable,
                mergeStateStatus: repository.pullRequest.mergeStateStatus,
                reviewDecision: repository.pullRequest.reviewDecision || '',
              };
              reviewThreads.push(...page.nodes);
              hasNextPage = page.pageInfo.hasNextPage;
              cursor = page.pageInfo.endCursor;
            }

            const unresolved = reviewThreads.filter((thread) => !thread.isResolved);
            const remainingBlocker =
              snapshot.mergeable === 'MERGEABLE' && snapshot.mergeStateStatus === 'BLOCKED'
                ? 'branch protection / maintainer review or merge action'
                : 'none visible in PR readiness job';
            const problems = [];
            await core.summary
              .addHeading('Release readiness snapshot')
              .addList([
                `Head SHA: ${snapshot.headRefOid}`,
                `Mergeable: ${snapshot.mergeable}`,
                `Merge state: ${snapshot.mergeStateStatus}`,
                `Review decision: ${snapshot.reviewDecision || 'none'}`,
                `Unresolved review threads: ${unresolved.length}`,
                `Remaining visible blocker: ${remainingBlocker}`,
              ])
              .write();
            if (unresolved.length) {
              problems.push(
                `${unresolved.length} unresolved review thread(s):\n` +
                unresolved.map((thread) => {
                  const first = thread.comments.nodes[0]?.body || '';
                  const title = first.split(/\r?\n/).find(Boolean) || 'review comment';
                  return `  • ${thread.path || 'unknown path'}:${thread.line || '?'} — ${title}`;
                }).join('\n')
              );
            }

            const changed = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 }
            );
            const text = [pr.title, pr.body || '', pr.head.ref].join('\n');
            const versionSignal = new RegExp(policy.versionPattern).test(text);
            const releaseFiles = changed.some(({ filename }) =>
              policy.releaseFiles.includes(filename) ||
              policy.releaseFileSuffixes.some((suffix) => filename.endsWith(suffix))
            );
            const triggerChecks = { versionSignal, releaseFiles };
            const needsHandoff = policy.handoffTriggers.some((trigger) => {
              if (!(trigger in triggerChecks)) {
                throw new Error(`Unknown release handoff trigger in policy: ${trigger}`);
              }
              return triggerChecks[trigger];
            });
            if (needsHandoff) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pr.number, per_page: 100 }
              );
              const handoffs = comments.filter((comment) => {
                const body = (comment.body || '').replace(/^\uFEFF/, '');
                return /^\s*## Release handoff:/m.test(body);
              });
              const latest = handoffs.at(-1);
              if (!latest) {
                problems.push('Release PR is missing a `## Release handoff:` PR comment.');
              } else {
                const body = (latest.body || '').replace(/^\uFEFF/, '');
                if (!body.includes(pr.head.sha)) {
                  problems.push(
                    `Latest release handoff is stale: it does not mention current head ${pr.head.sha}.`
                  );
                }
                const missingFields = policy.handoffRequiredText
                  .filter((required) => !body.includes(required));
                if (missingFields.length) {
                  problems.push(
                    'Latest release handoff is missing required snapshot field(s): ' +
                    missingFields.join(', ')
                  );
                }
                if (!problems.length) {
                  core.info(`Release handoff is current for ${pr.head.sha}.`);
                }
              }
            } else {
              core.info('No release handoff required for this PR.');
            }

            if (problems.length) {
              core.setFailed(problems.join('\n\n'));
            } else {
              core.info('No unresolved review threads; release handoff state is valid.');
            }

  base:
    name: base branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject a base that is not main or a release branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/check_pr_base.sh base "$BASE"

  # An rc branch is a second long-lived head, which is the shape behind every
  # instance of work being lost in this repo. It is safe only while it stays a
  # fast-forward of main — the moment main moves ahead, an rc merge either
  # conflicts or silently reverts, and a tag cut from it is no longer on main.
  #
  # Apply the same check to rc/*, release/* and releases/*. Keep the existing
  # job name stable for branch protection; main passes without an ancestry check.
  rc-current:
    name: rc not behind main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checked against the MERGE RESULT (the checked-out merge commit), not
      # against the base branch as it stands. Testing the base directly
      # deadlocks: the PR that merges main into the rc can never go green,
      # because the rc is still behind until that very PR lands. The question
      # worth asking is "would merging this leave the rc behind main?", and the
      # merge commit is what answers it.
      - name: Fail if merging this would leave the rc behind main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin main --quiet
          bash scripts/check_pr_base.sh current "$BASE"
