# Managed centrally; mirrors the monorepo's .github/dependabot.yml.
# Local to this repository as of 0.0.23: the `groups` blocks, so each ecosystem
# opens one pull request a week for minor and patch updates (majors still
# arrive one by one). A central sync would drop them; keep them.
# Ecosystems below are only those whose manifests actually exist in this repo.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
