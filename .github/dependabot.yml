# Managed centrally; mirrors the monorepo's .github/dependabot.yml.
# Local to this repository as of 0.0.23: the `groups` blocks, so each ecosystem
# opens one pull request a week for minor and patch updates (majors still
# arrive one by one). A central sync would drop them; keep them.
# Ecosystems below are only those whose manifests actually exist in this repo.
# Major versions are not proposed (the `ignore` blocks): each needs code
# changes, and the out-of-workspace lockfiles (playground, its spike, fuzz,
# rich-py) with it, so a major is taken by hand in a release pull request.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # rab's installed build workflow changes only by installing a newer kit
    # (`release.py vendored` fails CI on an edit); its pins move with rab's
    # own Dependabot.
    exclude-paths:
      - ".github/workflows/rab-build.yml"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
