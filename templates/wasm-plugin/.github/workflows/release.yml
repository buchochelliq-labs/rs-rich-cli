# Tests the plugin on every push and pull request, and on a `v*` tag builds
# the module and attaches it to that tag's GitHub release, with its SHA-256
# and size: the URL, hash, size and commit `rich plugin publish` asks for.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32-unknown-unknown target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Unit tests
        run: cargo test

      - name: Build the module
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Name it after the package
        id: module
        run: |
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          file="target/wasm32-unknown-unknown/release/${name//-/_}.wasm"
          cp "$file" "$name.wasm"
          sha256sum "$name.wasm" | tee "$name.wasm.sha256"
          echo "Size: $(stat -c %s "$name.wasm") bytes, commit $GITHUB_SHA"
          echo "file=$name.wasm" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: module
          path: ${{ steps.module.outputs.file }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: module

      - name: Attach the module to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA." ./*.wasm ./*.wasm.sha256
