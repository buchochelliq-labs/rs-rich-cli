# The docs playground (docs/design/docs-playground.md): rs-rich rendering
# in the reader's browser from wasm, for `.rich-playground` blocks and
# docs/playground.md. Tier 1: text inputs (markup, CSV, JSON, Markdown, …)
# in, ANSI or HTML out.
#
# Not a workspace member and never published: it has its own empty
# `[workspace]`, so the release tooling (release_cohort.py,
# check_packages.py, release.py), which reads the root workspace's members,
# never sees it. `build.sh` builds the two modules the site loads.
[package]
name = "rich-playground"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "rs-rich in the docs site's browser tab (not published)"

# Its own workspace, so it never joins the repo's.
[workspace]

[lib]
# cdylib for the browser; rlib so `cargo test` runs the renderers natively.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
# The intuiTUIve examples it includes carry their own docs, shell commands
# rather than doctests.
doctest = false

[features]
# The lean module has no syntect: markup, tables, trees, panels, rules,
# columns, JSON, charts, diffs and data views.
default = []
# The full module adds `Syntax` and `Markdown` (syntect, pulldown-cmark).
# It loads only when a block needs it.
full = ["rich/syntax", "rich/markdown", "rich-ext/syntax", "rich-ext/markdown"]
# The app module (tier 3): rs-rich-interact's components on its push API and
# intuiTUIve apps on a `Driver`, without syntect, keys decoded by rs-rich-web
# (its `server` feature off). It loads only for an `app` block.
app = ["dep:intuituive", "dep:rich-interact", "dep:rich-web"]

[dependencies]
rich = { package = "rs-rich", path = "../crates/rich", default-features = false }
rich-ext = { package = "rs-rich-ext", path = "../crates/rich-ext", default-features = false, features = ["data", "yaml"] }
intuituive = { package = "rs-rich-intuituive", path = "../crates/rich-intuituive", default-features = false, optional = true }
rich-interact = { package = "rs-rich-interact", path = "../crates/rich-interact", default-features = false, features = ["data"], optional = true }
rich-web = { package = "rs-rich-web", path = "../crates/rich-web", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
