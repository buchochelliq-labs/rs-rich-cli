site_name: rs-rich
site_description: A Rust port of Python's rich — rich text, colour and beautiful formatting in the terminal.
site_url: https://buchochelliq-labs.github.io/rs-rich-cli/
repo_url: https://github.com/buchochelliq-labs/rs-rich-cli
repo_name: buchochelliq-labs/rs-rich-cli
edit_uri: edit/main/docs/
copyright: MIT — a port of <a href="https://github.com/Textualize/rich">Textualize/rich</a>

docs_dir: docs
site_dir: site
# docs/python is its own site (mkdocs-python.yml), published under /python/.
exclude_docs: |
  python/
  assets/vendor/**/README.md
  assets/intuituive/mascot/MASCOT.md
  # Files to hand over to the rs-rich-marketplace repository, not pages.
  marketplace-repo/
  assets/noctiluca/ICONOGRAPHY.md

theme:
  name: material
  # rs-rich's mark and favicon (docs/assets/rs-rich/); intuiTUIve's pages
  # keep their own purple, set by assets/subsite.js.
  logo: assets/rs-rich/mark.svg
  favicon: assets/rs-rich/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # The docs are about terminal output, so dark is the honest default.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Guide snippets come from compiled examples; drop their source indent.
      dedent_subsections: true
      check_paths: true

plugins:
  - search

extra_css:
  - assets/extra.css
  - assets/vendor/asciinema-player-3.17.0/asciinema-player.css
  - assets/playground.css

extra_javascript:
  - assets/vendor/asciinema-player-3.17.0/asciinema-player.min.js
  - assets/tapes.js
  - assets/subsite.js
  - assets/playground.js

