# Release numbers: every package this repository publishes, the version it is
# at, and the order to publish in.
#
# Each entry's tag is derived, never written: a crates.io package is tagged
# `<name>-v<version>` (release.yml), the PyPI package `python-v<version>`
# (pypi-release.yml). Entries are listed in publication order, each after
# every workspace crate it depends on.
#
#   python3 scripts/release_cohort.py check    CI: this file matches every
#                                             manifest, and the order is valid
#   python3 scripts/release_cohort.py sync     rewrite the versions from the
#                                             manifests after a bump
#   python3 scripts/release_cohort.py status   what is published, tagged, or due
#   python3 scripts/release_cohort.py tag      tag everything not yet released,
#                                             one at a time, on main
#
# A version already on its registry is never tagged again: `tag` skips it, and
# both release workflows fail a tag whose version is already published.

[[package]]
name = "rs-rich"
registry = "crates.io"
manifest = "crates/rich/Cargo.toml"
version = "0.0.9"

